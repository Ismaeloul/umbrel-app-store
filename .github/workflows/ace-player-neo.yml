name: Ace Player Neo · carpeta de la app (0.7.0 y 0.6.59)

# Tests de la carpeta de la app de Umbrel (ismaeloul-ace-player-neo/), sin
# dependencias (node --test):
#
#   tests/release.test.js     coherencia del paquete que se publica: manifiesto,
#                             Compose, hook, releases/<versión actual>
#                             (REQUIRED_FILES, SHA256SUMS, service worker),
#                             imágenes por digest, /native/* en la lista blanca,
#                             límites y el vigilante de monitoring/.
#   tests/legacy-0.6.59/      los 133 tests de la 0.6.59 contra releases/0.6.59,
#                             que se queda en el repo como plan de vuelta atrás
#                             (ace-player-neo/docs/despliegue.md), con su Compose y
#                             su hook guardados en legacy-0.6.59/paquete/.
#
# Que la release commiteada sea exactamente la que sale del código lo comprueba
# ci.yml (job "Build, tamaño y humo", pnpm check:release). La v2 (ace-player-neo/)
# tiene allí el resto de su CI.

on:
  pull_request:
    paths:
      - 'ismaeloul-ace-player-neo/**'
      - 'ace-player-neo/deploy/umbrel/**'
      - '.gitattributes'
      - '.github/workflows/ace-player-neo.yml'
  push:
    paths:
      - 'ismaeloul-ace-player-neo/**'
      - 'ace-player-neo/deploy/umbrel/**'
      - '.gitattributes'
      - '.github/workflows/ace-player-neo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ismaeloul-ace-player-neo
    env:
      # El servidor de la 0.6.59 arranca la sincronizacion de listas al
      # cargarse; en CI no hay que salir a internet.
      AUTO_SYNC: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # La historia hace falta para comparar con el commit de la 0.6.59.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Coherencia del paquete de Umbrel (versión actual)
        if: ${{ !cancelled() }}
        run: node --test tests/release.test.js
      - name: 0.6.59 (vuelta atrás) — servidor y reproductor
        if: ${{ !cancelled() }}
        run: node --test tests/legacy-0.6.59/server.test.js tests/legacy-0.6.59/player-controller.test.js
      - name: La 0.6.59 de vuelta atrás sigue siendo la publicada
        if: ${{ !cancelled() }}
        run: |
          # Es lo que se copia para una 0.7.1 de vuelta atrás: release, Compose
          # y hook tienen que seguir siendo, byte a byte, los del commit que
          # publicó la 0.6.59 en main.
          base=22de27100749f2c02badd655e32f9bddeb1a0cf1
          git diff --exit-code "${base}" HEAD -- releases/0.6.59
          git show "${base}:ismaeloul-ace-player-neo/docker-compose.yml" | cmp - tests/legacy-0.6.59/paquete/docker-compose.yml
          git show "${base}:ismaeloul-ace-player-neo/hooks/pre-start" | cmp - tests/legacy-0.6.59/paquete/hooks/pre-start

  caddy:
    # Que Caddy (la misma imagen que el Compose) carga el Caddyfile de la sala con el dominio de
    # la app encendido y apagado. Un fallo en caddy/tv-on.caddy (p. ej. un escape de CEL mal
    # escrito en @raro) no solo tumba tv: es el mismo proceso, así que se cae también la sala.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: caddy validate (NATIVE_SITE on y off)
        run: |
          image=$(grep -oE 'caddy:[0-9.]+-alpine@sha256:[0-9a-f]{64}' ace-player-neo/deploy/umbrel/docker-compose.yml | head -n 1)
          test -n "${image}"
          for site in on off; do
            echo "NATIVE_SITE=${site} (${image})"
            docker run --rm \
              -e NATIVE_SITE="${site}" \
              -e NATIVE_DOMAIN=tv.example.com \
              -e PARTY_DOMAIN=sala.example.com \
              -e ACE_WEB_ROOT=/r/web \
              -v "${GITHUB_WORKSPACE}/ace-player-neo/deploy/umbrel:/r:ro" \
              "${image}" caddy validate --config /r/Caddyfile --adapter caddyfile
          done
