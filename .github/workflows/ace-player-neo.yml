name: Ace Player Neo checks

on:
  pull_request:
    paths:
      - "ismaeloul-ace-player-neo/**"
      - ".github/workflows/ace-player-neo.yml"
  push:
    paths:
      - "ismaeloul-ace-player-neo/**"
      - ".github/workflows/ace-player-neo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check JavaScript syntax
        run: |
          node --check ismaeloul-ace-player-neo/releases/0.6.9/server.js
          node --check ismaeloul-ace-player-neo/releases/0.6.9/engine-control.js
          node -e "const fs=require('fs');const s=fs.readFileSync('ismaeloul-ace-player-neo/releases/0.6.9/index.html','utf8');new Function(s.slice(s.lastIndexOf('<script>')+8,s.lastIndexOf('</script>')));"

      - name: Run backend tests
        run: node --test ismaeloul-ace-player-neo/tests/server.test.js

      - name: Check release references
        run: |
          node -e "const fs=require('fs');const c=fs.readFileSync('ismaeloul-ace-player-neo/docker-compose.yml','utf8');if(!c.includes('/releases/0.6.9/server.js')||!c.includes('/releases/0.6.9/engine-control.js')||!c.includes('/releases/0.6.9/.'))process.exit(1);"
          node -e "const fs=require('fs');const m=fs.readFileSync('ismaeloul-ace-player-neo/umbrel-app.yml','utf8');if(!m.includes('version: '+String.fromCharCode(34)+'0.6.9'+String.fromCharCode(34)))process.exit(1);"
