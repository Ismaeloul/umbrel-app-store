name: Ace Player Neo checks

on:
  pull_request:
    paths:
      - "ismaeloul-ace-player-neo/**"
      - ".github/workflows/ace-player-neo.yml"
  push:
    paths:
      - "ismaeloul-ace-player-neo/**"
      - ".github/workflows/ace-player-neo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Resolve release version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: "\([^"]*\)"/\1/p' ismaeloul-ace-player-neo/umbrel-app.yml)"
          test -n "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Check JavaScript syntax
        run: |
          node --check "ismaeloul-ace-player-neo/releases/${VERSION}/server.js"
          node --check "ismaeloul-ace-player-neo/releases/${VERSION}/engine-control.js"
          node -e "const fs=require('fs');const v=process.env.VERSION;const s=fs.readFileSync('ismaeloul-ace-player-neo/releases/'+v+'/index.html','utf8');new Function(s.slice(s.lastIndexOf('<script>')+8,s.lastIndexOf('</script>')));"

      - name: Run backend tests
        run: node --test ismaeloul-ace-player-neo/tests/server.test.js

      - name: Check release references
        run: |
          bash -n ismaeloul-ace-player-neo/hooks/pre-start
          test -x ismaeloul-ace-player-neo/hooks/pre-start
          node -e "const fs=require('fs');const v=process.env.VERSION;const c=fs.readFileSync('ismaeloul-ace-player-neo/docker-compose.yml','utf8');const h=fs.readFileSync('ismaeloul-ace-player-neo/hooks/pre-start','utf8');const refs=['/releases/'+v+'/server.js','/releases/'+v+'/engine-control.js','/releases/'+v+'/.'];if(refs.some(ref=>!c.includes(ref))||c.includes('release_sync')||!h.includes('VERSION='+String.fromCharCode(34)+v+String.fromCharCode(34))||!h.includes('SCRIPT_APP_REPO_DIR')||!h.includes('ace-player-neo-v${VERSION}'))process.exit(1);"
          node -e "const fs=require('fs');const v=process.env.VERSION;const m=fs.readFileSync('ismaeloul-ace-player-neo/umbrel-app.yml','utf8');if(!m.includes('version: '+String.fromCharCode(34)+v+String.fromCharCode(34)))process.exit(1);"
          node -e "const fs=require('fs');const v=process.env.VERSION;const root='ismaeloul-ace-player-neo/releases/'+v;const files=['server.js','engine-control.js','index.html','nginx.conf','icon.svg','vendor/hls.min.js','vendor/mpegts.js','vendor/fonts/inter-var.woff2','vendor/fonts/jetbrains-mono-var.woff2','vendor/fonts/outfit-var.woff2'];if(files.some(file=>!fs.statSync(root+'/'+file).size))process.exit(1);"
