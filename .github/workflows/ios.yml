name: iOS (Ace Neo)

# App iOS nativa de Ace Player Neo (ace-player-neo/apps/ios). No hay Mac: se
# compila y se prueba aquí (el repo es público, así que los minutos de macOS no
# cuestan). Diseño: design-explorations/docs/fuentes/fase3/b-arquitectura.md §4.4.
#   0. En Linux y en segundos, ANTES de gastar macOS:
#      - generadores: linter (revisar-swift.mjs) y --check de todo lo generado desde la web;
#      - nucleo-linux: el núcleo puro (Package.swift «NucleoPuro») con Swift 6.2.
#   1. XcodeGen genera el .xcodeproj desde project.yml.
#   2. solo_compilar: Debug de simulador + Release de dispositivo, con alarma de
#      expresiones lentas de tipar («to type-check»). Nada más.
#   3. Si no: tests unitarios (sin reintento) y de interfaz (con reintento; solo_uitests
#      elige unos pocos, sin unitarios ni IPA; la pila E2E solo si nombra ServidorRealUITests) en un
#      simulador de iPhone; los de interfaz van contra el servidor simulado de la app
#      y, además, contra el backend DE VERDAD: la pila E2E (motor AceStream falso +
#      backend del monorepo + ffmpeg) corre en este mismo runner (scripts/pila-e2e.mjs).
#   4. Capturas del simulador sacadas del .xcresult.
#   5. Archive en Release SIN FIRMAR y AceNeo-unsigned-<versión>.ipa como artefacto;
#      en un tag ios-v*, la IPA se adjunta a la Release de GitHub.

on:
  push:
    branches: [rewrite-v2, main]
    tags: ['ios-v*']
    paths:
      - 'ace-player-neo/apps/ios/**'
      - 'ace-player-neo/apps/web/src/**'
      - 'ace-player-neo/packages/shared/fixtures/**'
      - 'ace-player-neo/packages/shared/src/**'
      # El E2E de la app corre contra el backend y el motor falso del monorepo.
      - 'ace-player-neo/apps/server/src/**'
      - 'ace-player-neo/apps/server/test/fake-engine/**'
      - 'ace-player-neo/apps/web/e2e/support/**'
      - 'ace-player-neo/pnpm-lock.yaml'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ace-player-neo/apps/ios/**'
      - 'ace-player-neo/apps/web/src/**'
      - 'ace-player-neo/packages/shared/fixtures/**'
      - 'ace-player-neo/packages/shared/src/**'
      - 'ace-player-neo/apps/server/src/**'
      - 'ace-player-neo/apps/server/test/fake-engine/**'
      - 'ace-player-neo/apps/web/e2e/support/**'
      - 'ace-player-neo/pnpm-lock.yaml'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      solo_compilar:
        description: 'Debug simulador + Release dispositivo; nada más (unos minutos)'
        type: boolean
        default: false
      solo_unitarios:
        description: 'Compilar + tests unitarios (sin UITests ni pila E2E)'
        type: boolean
        default: false
      ipa_sin_tests:
        description: 'Compilar y sacar la IPA sin pasar pruebas'
        type: boolean
        default: false
      ipa_aunque_fallen_tests:
        description: 'Archivar y subir la IPA aunque falle algún test (para probar en el iPhone)'
        type: boolean
        default: false
      capturas:
        description: 'Capturas de la app (clave = agenda, partido, mini-reproductor, biblioteca-favoritos, ajustes, emparejar)'
        type: choice
        options: [ninguna, clave, completas]
        default: ninguna
      simulador:
        description: 'Simulador de iPhone (si no existe, el iPhone más reciente del runner)'
        type: string
        default: 'iPhone 16e'
      solo_uitests:
        description: 'Solo estos UITests, separados por comas (p. ej. FlujoArmazonUITests,LaboratorioUITests/testHapticaConHoja), sin unitarios ni IPA (pila E2E solo si nombra ServidorRealUITests)'
        type: string
        default: ''

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  generadores:
    name: Linter y generadores (--check)
    # Con solo_compilar se saltan para que el Mac empiece antes; corren en todo lo demás.
    if: ${{ !inputs.solo_compilar }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ace-player-neo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Linter de Swift (b-arquitectura §5.2)
        run: node apps/ios/scripts/revisar-swift.mjs

      - name: Instalar el monorepo (fuentes de @fontsource y tsx)
        run: corepack enable && corepack pnpm@10.18.2 install --frozen-lockfile

      - name: Todo lo generado desde la web está al día
        run: |
          set -euo pipefail
          node apps/ios/scripts/generar-tokens.mjs --check
          node apps/ios/scripts/generar-iconos.mjs --check
          node apps/ios/scripts/generar-plazos.mjs --check
          node apps/ios/scripts/generar-rutas.mjs --check
          node apps/ios/scripts/generar-catalogo-errores.mjs --check
          # Hasta que M2 lo sustituya por vectores/dominio.ts (generar-vectores.ts).
          if [ -f apps/ios/scripts/generar-vectores.mjs ]; then node apps/ios/scripts/generar-vectores.mjs --check; fi
          if [ -f apps/ios/scripts/generar-vectores.ts ]; then corepack pnpm@10.18.2 exec tsx apps/ios/scripts/generar-vectores.ts --check; fi
          if [ -f apps/ios/scripts/generar-demo.ts ]; then corepack pnpm@10.18.2 exec tsx apps/ios/scripts/generar-demo.ts --check; fi
          pip install -q fonttools brotli
          python3 apps/ios/scripts/generar-fuentes.py --check

  nucleo-linux:
    name: Núcleo puro en Linux (Swift 6.2)
    if: ${{ !inputs.solo_compilar }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4

      - name: tzdata (Europe/Madrid)
        run: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq tzdata

      - name: swift test
        working-directory: ace-player-neo/apps/ios
        run: swift test

  ios:
    name: Compilar, probar y empaquetar
    needs: [generadores, nucleo-linux]
    # Corre si los dos anteriores pasan o se han saltado (solo_compilar).
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      # Solo hace falta para adjuntar la IPA a la Release en los tags ios-v*.
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ace-player-neo/apps/ios
    env:
      SOLO_COMPILAR: ${{ inputs.solo_compilar == true }}
      # Pruebas: todas salvo con solo_compilar o ipa_sin_tests.
      CON_TESTS: ${{ inputs.solo_compilar != true && inputs.ipa_sin_tests != true }}
      # UITests: además, no con solo_unitarios.
      CON_UITESTS: ${{ inputs.solo_compilar != true && inputs.ipa_sin_tests != true && inputs.solo_unitarios != true }}
      # solo_uitests: solo esos UITests (AceNeoUITests/<valor>), sin unitarios y sin IPA; sin pila E2E salvo que
      # el filtro nombre ServidorRealUITests.
      SOLO_UI: ${{ inputs.solo_uitests || '' }}
      # Pila E2E (motor falso + backend + ffmpeg): con los UITests completos, o con solo_uitests si incluye
      # ServidorRealUITests (el E2E de I1 se puede lanzar solo, en minutos).
      CON_E2E: ${{ inputs.solo_compilar != true && inputs.ipa_sin_tests != true && inputs.solo_unitarios != true && (!inputs.solo_uitests || contains(inputs.solo_uitests, 'ServidorRealUITests')) }}
      SIMULADOR: ${{ inputs.simulador || 'iPhone 16e' }}
      CAPTURAS: ${{ inputs.capturas || 'ninguna' }}
    steps:
      - uses: actions/checkout@v4

      - name: Elegir Xcode (26.6 si está; si no, el más reciente, con aviso)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          if [ -d /Applications/Xcode_26.6.app ]; then
            XCODE=/Applications/Xcode_26.6.app
          else
            XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
              | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' \
              | sed -E 's#^.*/Xcode_([0-9.]+)\.app$#\1 &#' \
              | sort -V | tail -1 | cut -d' ' -f2 || true)
            echo "::warning::No está Xcode 26.6 en el runner: uso ${XCODE:-el de por defecto}"
          fi
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E 'ios|simulator' || true

      - name: Instalar XcodeGen (y ffmpeg en segundo plano si hay pila E2E)
        run: |
          set -euo pipefail
          brew install xcodegen
          # ffmpeg tarda: se instala mientras compila Xcode. El paso de la pila
          # espera al fichero .fin (con el código de salida de brew).
          if [ "$CON_E2E" != "true" ]; then
            echo "Sin pila E2E: sin ffmpeg."
          elif command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then
            echo 0 > "$RUNNER_TEMP/brew-ffmpeg.fin"
          else
            nohup bash -c 'brew install ffmpeg > "$RUNNER_TEMP/brew-ffmpeg.log" 2>&1; echo $? > "$RUNNER_TEMP/brew-ffmpeg.fin"' > /dev/null 2>&1 &
          fi

      - uses: actions/setup-node@v4
        if: env.CON_E2E == 'true'
        with:
          node-version: 24

      - name: pnpm (corepack, versión de packageManager)
        if: env.CON_E2E == 'true'
        working-directory: ace-player-neo
        run: corepack enable && pnpm --version && echo "STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        if: env.CON_E2E == 'true'
        with:
          path: ${{ env.STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('ace-player-neo/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Instalar el monorepo (para la pila E2E)
        if: env.CON_E2E == 'true'
        working-directory: ace-player-neo
        run: pnpm install --frozen-lockfile

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Elegir simulador (y arrancarlo en segundo plano si hay pruebas)
        id: simulador
        run: |
          set -euo pipefail
          # El primer arranque del simulador tarda minutos: se lanza ya y se
          # compila mientras tanto (los errores de compilación salen antes).
          ID=$(xcrun simctl list devices available -j | SIMULADOR="$SIMULADOR" python3 -c '
          import json, os, re, sys
          datos = json.load(sys.stdin)["devices"]
          pedido = os.environ.get("SIMULADOR", "")
          mejor = None
          for runtime, equipos in datos.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for e in equipos:
                  nombre = e.get("name", "")
                  if not nombre.startswith("iPhone") or not e.get("isAvailable", True):
                      continue
                  clave = (nombre == pedido, version, nombre.endswith(" Pro"))
                  if mejor is None or clave > mejor[0]:
                      mejor = (clave, e["udid"], nombre, version)
          if mejor:
              print(mejor[1])
              print("Simulador: %s (iOS %d.%d)" % (mejor[2], *mejor[3]), file=sys.stderr)
              if mejor[2] != pedido:
                  print("::warning::No hay «%s»: uso %s" % (pedido, mejor[2]), file=sys.stderr)
          ' || true)
          if [ -z "$ID" ]; then
            echo "No hay simulador de iPhone: creo uno."
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          r = [x for x in json.load(sys.stdin)["runtimes"] if x.get("platform") == "iOS" or x["name"].startswith("iOS")]
          r.sort(key=lambda x: [int(p) for p in x["version"].split(".")])
          print(r[-1]["identifier"])')
            TIPO=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          t = [x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")]
          print(t[-1]["identifier"])')
            ID=$(xcrun simctl create "iPhone CI" "$TIPO" "$RUNTIME")
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          if [ "$CON_TESTS" = "true" ]; then
            nohup xcrun simctl boot "$ID" > "$RUNNER_TEMP/arranque-simulador.log" 2>&1 &
          fi

      - name: Alarma de expresiones lentas de tipar (script)
        run: |
          # Busca «to type-check» (-warn-long-expression-type-checking=200 y
          # -warn-long-function-bodies=400 de project.yml) en un log de xcodebuild.
          # Desde la poda (fase 0.2) cuenta todo: la interfaz vieja ya no está.
          cat > "$RUNNER_TEMP/alarma-tipado.sh" <<'EOF'
          #!/bin/bash
          LENTAS=$(grep -E "to type-check" "$1" | sort -u | grep -v '^$' || true)
          if [ -n "$LENTAS" ]; then
            echo "$LENTAS" | while IFS= read -r l; do echo "::error::Lenta de tipar: $l"; done
            exit 1
          fi
          echo "Sin expresiones ni funciones lentas de tipar."
          EOF
          chmod +x "$RUNNER_TEMP/alarma-tipado.sh"

      - name: Solo compilar (Debug simulador + Release dispositivo)
        if: env.SOLO_COMPILAR == 'true'
        run: |
          set -o pipefail
          mkdir -p build
          # Debug de simulador con build-for-testing: la app Y sus dos objetivos de pruebas
          # (un test que no compila sale aquí, no en la CI completa).
          xcodebuild build-for-testing -project AceNeo.xcodeproj -scheme AceNeo -configuration Debug \
            -destination "id=${{ steps.simulador.outputs.id }}" \
            -derivedDataPath build/DerivedData -quiet \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee build/compilar.log
          xcodebuild build -project AceNeo.xcodeproj -scheme AceNeo -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build/DerivedData -quiet \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee -a build/compilar.log
          "$RUNNER_TEMP/alarma-tipado.sh" build/compilar.log

      - name: Compilar para los tests
        id: compilar_tests
        if: env.CON_TESTS == 'true'
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project AceNeo.xcodeproj \
            -scheme AceNeo \
            -destination "id=${{ steps.simulador.outputs.id }}" \
            -derivedDataPath build/DerivedData \
            -quiet \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee build/compilar.log
          "$RUNNER_TEMP/alarma-tipado.sh" build/compilar.log

      - name: Subir el log de compilación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-compilar-log
          path: ace-player-neo/apps/ios/build/compilar.log
          if-no-files-found: ignore

      - name: Arrancar la pila E2E (motor falso + backend de verdad + ffmpeg)
        id: pila
        if: env.CON_E2E == 'true'
        env:
          ACE_E2E_PUERTO: '18790'
          ACE_E2E_DIR: ${{ runner.temp }}/pila-e2e
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            [ -f "$RUNNER_TEMP/brew-ffmpeg.fin" ] && break
            sleep 2
          done
          if [ "$(cat "$RUNNER_TEMP/brew-ffmpeg.fin" 2>/dev/null || echo x)" != "0" ]; then
            tail -n 60 "$RUNNER_TEMP/brew-ffmpeg.log" || true
            echo "::error::No se pudo instalar ffmpeg: sin él el backend no prepara el vídeo del iPhone"
            exit 1
          fi
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          mkdir -p "$ACE_E2E_DIR"
          nohup node scripts/pila-e2e.mjs > "$ACE_E2E_DIR/pila.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:$ACE_E2E_PUERTO/native/api/v1/ping" > /dev/null; then break; fi
            sleep 2
          done
          cat "$ACE_E2E_DIR/pila.log"
          curl -sf "http://127.0.0.1:$ACE_E2E_PUERTO/native/api/v1/ping"
          echo
          echo "puerto=$ACE_E2E_PUERTO" >> "$GITHUB_OUTPUT"

      - name: Esperar al simulador
        if: env.CON_TESTS == 'true'
        run: |
          cat "$RUNNER_TEMP/arranque-simulador.log" || true
          xcrun simctl bootstatus "${{ steps.simulador.outputs.id }}" -b

      - name: Barra de estado fija para las capturas (9:41)
        if: env.CON_UITESTS == 'true' && env.CAPTURAS != 'ninguna'
        run: |
          xcrun simctl status_bar "${{ steps.simulador.outputs.id }}" override \
            --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true

      - name: Tests unitarios (sin reintento)
        id: unitarios
        if: env.CON_TESTS == 'true' && env.SOLO_UI == '' && steps.compilar_tests.outcome == 'success'
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project AceNeo.xcodeproj \
            -scheme AceNeo \
            -destination "id=${{ steps.simulador.outputs.id }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AceNeo-unitarios.xcresult \
            -only-testing:AceNeoTests \
            -quiet

      - name: Tests de interfaz (con reintento)
        if: ${{ !cancelled() && env.CON_UITESTS == 'true' && steps.compilar_tests.outcome == 'success' }}
        env:
          # xcodebuild quita el prefijo TEST_RUNNER_ y se lo pasa al ejecutor de
          # las pruebas: ServidorRealUITests habla con la pila por ese puerto y las
          # capturas saben qué juego sacar.
          TEST_RUNNER_ACE_E2E_PUERTO: ${{ steps.pila.outputs.puerto }}
          TEST_RUNNER_ACE_CAPTURAS: ${{ env.CAPTURAS }}
        run: |
          set -o pipefail
          # Con solo_uitests, solo AceNeoUITests/<cada valor, separados por comas>; si no, todos (con
          # ServidorRealUITests y la pila).
          FILTROS=("-only-testing:AceNeoUITests")
          if [ -n "$SOLO_UI" ]; then
            FILTROS=()
            IFS=',' read -ra PEDIDOS <<< "$SOLO_UI"
            for P in "${PEDIDOS[@]}"; do
              P="${P// /}"
              if [ -n "$P" ]; then FILTROS+=("-only-testing:AceNeoUITests/$P"); fi
            done
          fi
          xcodebuild test-without-building \
            -project AceNeo.xcodeproj \
            -scheme AceNeo \
            -destination "id=${{ steps.simulador.outputs.id }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/AceNeo-interfaz.xcresult \
            "${FILTROS[@]}" \
            -retry-tests-on-failure -test-iterations 3 \
            -quiet

      - name: Resumen de los tests
        if: always()
        run: |
          mkdir -p build/capturas
          for RESULTADO in build/*.xcresult; do
            [ -d "$RESULTADO" ] || continue
            NOMBRE=$(basename "$RESULTADO" .xcresult)
            echo "::group::Resumen de $NOMBRE"
            xcrun xcresulttool get test-results summary --path "$RESULTADO" --compact > "build/$NOMBRE-resumen.json" || true
            cat "build/$NOMBRE-resumen.json" || true
            echo "::endgroup::"
            # Detalle (mensaje y línea) de cada test que falla.
            RESULTADO="$RESULTADO" NOMBRE="$NOMBRE" python3 - <<'PY' || true
          import json, os, subprocess
          nombre = os.environ["NOMBRE"]
          try:
              resumen = json.load(open("build/%s-resumen.json" % nombre))
          except Exception:
              resumen = {}
          for fallo in resumen.get("testFailures", []):
              ident = fallo.get("testIdentifierString", "")
              print("::group::Fallo: " + ident)
              subprocess.run(["xcrun", "xcresulttool", "get", "test-results", "test-details",
                              "--test-id", ident, "--path", os.environ["RESULTADO"], "--compact"])
              print("::endgroup::")
          PY
            # Capturas de las pruebas (y las de los fallos), con el nombre que les dio el test.
            SALIDA="build/capturas-$NOMBRE"
            mkdir -p "$SALIDA"
            xcrun xcresulttool export attachments --path "$RESULTADO" --output-path "$SALIDA" || true
            SALIDA="$SALIDA" python3 - <<'PY' || true
          import json, os, re, shutil
          base = os.environ["SALIDA"]
          try:
              manifiesto = json.load(open(os.path.join(base, "manifest.json")))
          except Exception:
              manifiesto = []
          for prueba in manifiesto:
              for adjunto in prueba.get("attachments", []):
                  origen = os.path.join(base, adjunto.get("exportedFileName", ""))
                  nombre = adjunto.get("suggestedHumanReadableName") or os.path.basename(origen)
                  nombre = re.sub(r"_\d+_[0-9A-Fa-f-]{36}(\.\w+)$", r"\1", nombre)
                  # upload-artifact no admite " : < > | * ? ni saltos de línea.
                  nombre = re.sub(r'[\\/"<>:|*?\r\n]', "_", nombre)
                  if adjunto.get("isAssociatedWithFailure"):
                      nombre = "fallo-" + nombre
                  repeticion = adjunto.get("repetitionNumber") or 1
                  if repeticion > 1:
                      raiz, ext = os.path.splitext(nombre)
                      nombre = "%s-intento%d%s" % (raiz, repeticion, ext)
                  destino = os.path.join("build/capturas", nombre)
                  if os.path.isfile(origen) and not os.path.exists(destino):
                      shutil.move(origen, destino)
          PY
          done
          ls -la build/capturas || true

      - name: Subir las capturas del simulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-capturas
          path: ace-player-neo/apps/ios/build/capturas
          if-no-files-found: ignore

      - name: Subir los logs de la pila E2E
        if: always() && env.CON_E2E == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-pila-e2e-logs
          path: |
            ${{ runner.temp }}/pila-e2e/*.log
            ${{ runner.temp }}/brew-ffmpeg.log
          if-no-files-found: ignore

      - name: Archive sin firmar e IPA
        id: ipa
        # Solo si todo lo anterior ha ido bien (con ipa_sin_tests no hay pruebas); lanzado
        # a mano con «ipa_aunque_fallen_tests», también con tests en rojo. Nunca con
        # solo_compilar ni solo_unitarios.
        if: ${{ !inputs.solo_compilar && !inputs.solo_unitarios && !inputs.solo_uitests && (success() || (!cancelled() && inputs.ipa_aunque_fallen_tests)) }}
        run: |
          set -euo pipefail
          AJUSTES=(CURRENT_PROJECT_VERSION=${{ github.run_number }})
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            AJUSTES+=(MARKETING_VERSION="${GITHUB_REF_NAME#ios-v}")
          fi
          bash scripts/build-ipa.sh "${AJUSTES[@]}"

      - name: Subir la IPA
        if: ${{ !cancelled() && steps.ipa.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-unsigned-${{ steps.ipa.outputs.version }}
          path: ace-player-neo/apps/ios/${{ steps.ipa.outputs.ipa }}
          if-no-files-found: error

      - name: Subir el resultado de los tests (.xcresult)
        if: always() && env.CON_TESTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-tests-xcresult
          path: ace-player-neo/apps/ios/build/*.xcresult
          if-no-files-found: warn

      - name: Adjuntar la IPA a la Release (tags ios-v*)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ipa.outputs.version }}
          IPA: ${{ steps.ipa.outputs.ipa }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "Ace Neo $VERSION (iOS)" \
              --notes "IPA de Ace Neo $VERSION SIN FIRMAR (compilación ${{ github.run_number }}). Fírmala con tu herramienta antes de instalarla."
          fi
          gh release upload "$GITHUB_REF_NAME" "$IPA" -R "$GITHUB_REPOSITORY" --clobber
