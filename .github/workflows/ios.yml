name: iOS (Ace Neo)

# App iOS nativa de Ace Player Neo (ace-player-neo/apps/ios). No hay Mac: se
# compila y se prueba aquí, en el runner de macOS (el repo es público, así que
# los minutos de macOS no cuestan).
#   1. XcodeGen genera el .xcodeproj desde project.yml.
#   2. Tests unitarios y de interfaz en un simulador de iPhone.
#   3. Archive en Release SIN FIRMAR y AceNeo-unsigned-<versión>.ipa como artefacto.
#   4. En un tag ios-v*, la IPA se adjunta a la Release de GitHub.

on:
  push:
    branches: [rewrite-v2, main]
    tags: ['ios-v*']
    paths:
      - 'ace-player-neo/apps/ios/**'
      - 'ace-player-neo/packages/shared/fixtures/**'
      - 'ace-player-neo/packages/shared/src/errors.ts'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'ace-player-neo/apps/ios/**'
      - 'ace-player-neo/packages/shared/fixtures/**'
      - 'ace-player-neo/packages/shared/src/errors.ts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_CLEANUP: '1'

jobs:
  ios:
    name: Compilar, probar y empaquetar
    runs-on: macos-latest
    timeout-minutes: 75
    permissions:
      # Solo hace falta para adjuntar la IPA a la Release en los tags ios-v*.
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: ace-player-neo/apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Elegir el Xcode más reciente (SDK con Liquid Glass)
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null \
            | grep -E '/Xcode_[0-9]+(\.[0-9]+)*\.app$' \
            | sed -E 's#^.*/Xcode_([0-9.]+)\.app$#\1 &#' \
            | sort -V | tail -1 | cut -d' ' -f2 || true)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E 'ios|simulator' || true

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Comprobar el catálogo de errores (mismo que packages/shared)
        run: node scripts/generar-catalogo-errores.mjs --check

      - name: Generar el proyecto
        run: xcodegen generate

      - name: Arrancar un simulador de iPhone (en segundo plano)
        id: simulador
        run: |
          set -euo pipefail
          # El primer arranque del simulador tarda minutos: se lanza ya y se
          # compila mientras tanto (los errores de compilación salen antes).
          ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          datos = json.load(sys.stdin)["devices"]
          mejor = None
          for runtime, equipos in datos.items():
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              for e in equipos:
                  nombre = e.get("name", "")
                  if not nombre.startswith("iPhone") or not e.get("isAvailable", True):
                      continue
                  clave = (version, nombre.endswith(" Pro"))
                  if mejor is None or clave > mejor[0]:
                      mejor = (clave, e["udid"], nombre, version)
          if mejor:
              print(mejor[1])
              print("Simulador: %s (iOS %d.%d)" % (mejor[2], *mejor[3]), file=sys.stderr)
          ' || true)
          if [ -z "$ID" ]; then
            echo "No hay simulador de iPhone: creo uno."
            RUNTIME=$(xcrun simctl list runtimes available -j | python3 -c '
          import json, sys
          r = [x for x in json.load(sys.stdin)["runtimes"] if x.get("platform") == "iOS" or x["name"].startswith("iOS")]
          r.sort(key=lambda x: [int(p) for p in x["version"].split(".")])
          print(r[-1]["identifier"])')
            TIPO=$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          t = [x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone")]
          print(t[-1]["identifier"])')
            ID=$(xcrun simctl create "iPhone CI" "$TIPO" "$RUNTIME")
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          nohup xcrun simctl boot "$ID" > "$RUNNER_TEMP/arranque-simulador.log" 2>&1 &

      - name: Compilar para los tests
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing             -project AceNeo.xcodeproj             -scheme AceNeo             -destination "id=${{ steps.simulador.outputs.id }}"             -derivedDataPath build/DerivedData             -quiet             CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Esperar al simulador
        run: |
          cat "$RUNNER_TEMP/arranque-simulador.log" || true
          xcrun simctl bootstatus "${{ steps.simulador.outputs.id }}" -b

      - name: Tests unitarios y de interfaz
        run: |
          set -o pipefail
          xcodebuild test-without-building             -project AceNeo.xcodeproj             -scheme AceNeo             -destination "id=${{ steps.simulador.outputs.id }}"             -derivedDataPath build/DerivedData             -resultBundlePath build/AceNeo-tests.xcresult             -retry-tests-on-failure -test-iterations 2             -quiet

      - name: Resumen de los tests
        if: always()
        run: |
          RESULTADO=build/AceNeo-tests.xcresult
          if [ -d "$RESULTADO" ]; then
            xcrun xcresulttool get test-results summary --path "$RESULTADO" --compact > build/resumen.json || true
            cat build/resumen.json || true
            # Detalle (mensaje y línea) de cada test que falla.
            python3 - <<'PY' || true
          import json, subprocess
          try:
              resumen = json.load(open("build/resumen.json"))
          except Exception:
              resumen = {}
          for fallo in resumen.get("testFailures", []):
              ident = fallo.get("testIdentifierString", "")
              print("::group::Fallo: " + ident)
              subprocess.run(["xcrun", "xcresulttool", "get", "test-results", "test-details",
                              "--test-id", ident, "--path", "build/AceNeo-tests.xcresult", "--compact"])
              print("::endgroup::")
          PY
            # Capturas de las pruebas de interfaz (y las de los fallos).
            mkdir -p build/capturas
            xcrun xcresulttool export attachments --path "$RESULTADO" --output-path build/capturas || true
            ls -la build/capturas || true
          fi

      - name: Subir las capturas del simulador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-capturas
          path: ace-player-neo/apps/ios/build/capturas
          if-no-files-found: ignore

      - name: Archive sin firmar e IPA
        id: ipa
        run: |
          set -euo pipefail
          AJUSTES=(CURRENT_PROJECT_VERSION=${{ github.run_number }})
          if [[ "$GITHUB_REF" == refs/tags/ios-v* ]]; then
            AJUSTES+=(MARKETING_VERSION="${GITHUB_REF_NAME#ios-v}")
          fi
          bash scripts/build-ipa.sh "${AJUSTES[@]}"

      - name: Subir la IPA
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-unsigned-${{ steps.ipa.outputs.version }}
          path: ace-player-neo/apps/ios/${{ steps.ipa.outputs.ipa }}
          if-no-files-found: error

      - name: Subir el resultado de los tests (.xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AceNeo-tests-xcresult
          path: ace-player-neo/apps/ios/build/AceNeo-tests.xcresult
          if-no-files-found: warn

      - name: Adjuntar la IPA a la Release (tags ios-v*)
        if: startsWith(github.ref, 'refs/tags/ios-v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ipa.outputs.version }}
          IPA: ${{ steps.ipa.outputs.ipa }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" \
              --title "Ace Neo $VERSION (iOS)" \
              --notes "IPA de Ace Neo $VERSION SIN FIRMAR (compilación ${{ github.run_number }}). Fírmala con tu herramienta antes de instalarla."
          fi
          gh release upload "$GITHUB_REF_NAME" "$IPA" -R "$GITHUB_REPOSITORY" --clobber
