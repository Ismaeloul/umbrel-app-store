name: Armario
version: "0.3.2"
tagline: Tu armario virtual, con las prendas catalogadas por IA
description: >-
  Armario es un armario virtual personal. Haces una foto a cada prenda y la IA
  rellena por ti el tipo, los colores, el estampado, el estilo y la temporada;
  tú revisas el borrador y lo guardas.

  El catálogo se filtra por temporada y por categoría, y cada prenda tiene su
  ficha con las fotos de delante y detrás, si es favorita, cuántas veces te la
  has puesto y si está en la lavadora.

  La IA principal es Codex, con tu suscripción de ChatGPT; si falla, se usa
  Claude con tu API key de Anthropic y la app te lo dice. Si fallan las dos,
  puedes reintentar o rellenar los datos a mano.

  Está pensada para el móvil: ábrela en el iPhone y añádela a la pantalla de
  inicio. Tiene tema claro y oscuro.

  Todo se configura en Ajustes: inicias sesión en Codex con un código (sin
  terminal), ves cuánto límite te queda en tu suscripción y pegas tu API key
  de Claude si quieres tenerlo de respaldo.

  Cada día, la pantalla Hoy te propone un outfit según el tiempo de tu ciudad,
  la época del año y lo que tienes en la lavadora. En Gustos valoras
  combinaciones y la app aprende qué te pega y qué no.

releaseNotes: >-
  0.3.2: repaso general. Iconos nuevos, confirmación antes de eliminar una prenda, cerrar sesión o vaciar la lavadora, avisos cuando algo falla, campos que ya no hacen zoom en el iPhone y un algoritmo de outfits más afinado.

  0.3.1: el código para iniciar sesión en Codex ya se copia al tocarlo.

  Outfit del día. La pantalla Hoy propone qué ponerte según el tiempo de tu
  ciudad y la temporada, sin repetir combinaciones ni usar lo que está en la
  lavadora. Puedes pasar, pedir otra propuesta o marcar «Me gusta», que apunta
  el uso de cada prenda.

  Gustos. Una pestaña nueva para valorar combinaciones: me gusta o no me gusta,
  y por qué (colores, calzado, estilo, soso, recargado, o señalando prendas).
  Lo que valoras ajusta las propuestas de Hoy.

  Reglas de estilo de partida. Antes de conocer tus gustos, la app ya sabe qué
  colores, estilos, estampados y capas suelen combinar.

  Calzado. Al añadir eliges «Prenda de ropa» o «Zapatilla», con sus propias
  fotos: lateral, de frente y el otro lateral.

  Rasgos de la prenda. La IA apunta también el cierre, si tiene capucha, el
  corte y el grosor. Las prendas que ya tenías los tienen vacíos hasta que los
  rellenes al editarlas.

  Ropa de verano solo en su época. Pantalón corto y manga corta se proponen de
  mayo a septiembre, aunque un día de invierno suba la temperatura.

  Iconos nuevos y, en Ajustes, una opción escondida para borrar lo aprendido.

  Actualizar no borra nada: tus prendas y la sesión de Codex se conservan.

