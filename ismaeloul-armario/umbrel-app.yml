name: Armario
version: "0.4.6"
tagline: Tu armario virtual, con las prendas catalogadas por IA
description: >-
  Armario es un armario virtual personal. Haces una foto a cada prenda y la IA
  rellena por ti el tipo, los colores, el estampado, el estilo y la temporada;
  tú revisas el borrador y lo guardas.

  El catálogo se filtra por temporada y por categoría, y cada prenda tiene su
  ficha con las fotos de delante y detrás, si es favorita, cuántas veces te la
  has puesto y si está en la lavadora.

  La IA principal es Codex, con tu suscripción de ChatGPT; si falla, se usa
  Claude con tu API key de Anthropic y la app te lo dice. Si fallan las dos,
  puedes reintentar o rellenar los datos a mano.

  Está pensada para el móvil: ábrela en el iPhone y añádela a la pantalla de
  inicio. Tiene tema claro y oscuro.

  Todo se configura en Ajustes: inicias sesión en Codex con un código (sin
  terminal), ves cuánto límite te queda en tu suscripción y pegas tu API key
  de Claude si quieres tenerlo de respaldo.

  La pestaña Compras trae cada semana novedades de las tiendas que actives,
  las compara con tu armario y te las enseña para deslizar. La app solo enlaza
  a la tienda: nunca compra ni guarda datos de pago.

  Cada día, la pantalla Hoy te propone un outfit según el tiempo de tu ciudad,
  la época del año y lo que tienes en la lavadora. En Gustos valoras
  combinaciones y la app aprende qué te pega y qué no.

releaseNotes: >-
  0.4.6: animaciones en toda la app (cargas con destello, cambios de pantalla
  suaves, tarjetas que entran una tras otra). En la ficha de las prendas con
  fotos tuyas, «Editar foto con Codex» las redibuja como fotos de tienda: ves
  el antes y el después y decides; tus fotos se guardan. Al cambiar entre
  claro y oscuro, las bandas del iPhone cambian también.

  0.4.5: al comprar algo de Me gustan puedes decir «La he pedido, aún no ha
  llegado»: entra en el armario como «Pedida», no se te propone en Hoy hasta
  que pulses «Ya me ha llegado» en su ficha, y sí sale en Gustos para ir
  valorando. El aviso de prendas en la lavadora abre ahora el listado de lo
  que se está lavando. En la ficha, la foto se ve entera.

  0.4.4: Nike se lee ahora con el navegador y trae el catálogo entero (antes
  solo la primera página). En Descubrir, la tarjeta de debajo ya no cambia
  mientras decides. Con el filtro de una tienda, el botón dice «Ver más de»
  esa tienda, o «Buscar más en» ella si no queda nada guardado.

  0.4.3: quince tiendas más, todas de Francia y desactivadas hasta que las
  actives: Massimo Dutti, Lefties, Nike, Jack & Jones, Carhartt WIP, Snipes,
  size?, Foot Locker, Jules, Bonobo, Uniqlo, Mango, H&M, COS y Weekday. En
  H&M, COS, Uniqlo y Mango no se ven las tallas: se miran en la tienda.

  El catálogo completo de cada tienda se lee de noche, despacio, y las
  propuestas salen de todo él según tus gustos. Una zapatilla que está en
  varias tiendas sale una sola vez, con el precio de cada una.

  Descubrir enseña una pila de tarjetas con las fotos ya cargadas, una barra
  de progreso real mientras se consulta, y los colores agotados en gris.

  0.4.2: JD Sports se lee ahora con el navegador (antes fallaba) y, al cambiar
  de color, la prenda conserva su nombre traducido.

  0.4.1: pestaña Compras. Novedades semanales de Zara, Courir, JD Sports,
  Pull&Bear y Bershka (tiendas de Francia), puntuadas contra tu armario y tus
  gustos. Deslizas a la derecha si te gusta y a la izquierda si no; puedes
  volver atrás, filtrar por tienda y por tipo de prenda, y pedir más.

  Me gustan. Tu lista guardada, con caducidad. Al abrir una prenda ves su
  referencia, tallas, composición, enlace y con qué prendas de tu armario
  combina. «La he comprado» la pasa al armario con las fotos de la tienda.

  Buscador. Pega una referencia o un enlace de la tienda para guardarla o
  meterla directamente en tu armario.

  Colores. Si una prenda existe en más colores, eliges cuál ver.

  Tiendas. Un panel con el estado de cada tienda: si funciona, si falló y por
  qué, y cuándo toca la próxima consulta. Arrancan desactivadas.

  Los nombres de las tiendas se traducen al español con Codex. En Ajustes
  eliges el modelo y el esfuerzo para analizar fotos y para traducir.

  Esta versión pesa bastante más: incluye un navegador para leer Pull&Bear y
  Bershka. Actualizar no borra nada.

