name: Trajet
version: "0.4.3"
tagline: Tus trayectos de Île-de-France en tiempo real, en el iPhone
description: >-
  Trajet muestra los próximos pasos de tus trayectos habituales en transporte
  público de Île-de-France, con los datos en tiempo real del portal PRIM de
  Île-de-France Mobilités. Esta app es el servidor de la app de iPhone Trajet
  y su panel de control.

  Guardas tus rutas (Casa → Trabajo, la vuelta desde clase…) con sus tramos y
  transbordos, y la app enseña sola la que toca según el día de la semana y la
  hora. Por cada tramo verás los próximos pasos con los minutos que faltan en
  grande, el destino, el andén cuando la red lo publica (y una vía probable,
  aprendida, cuando todavía no) y el retraso. Siempre dice de cuándo es el
  dato que estás viendo.

  Si una de tus líneas está perturbada o interrumpida, calcula rutas
  alternativas evitándola y comprueba que las líneas de la alternativa tampoco
  estén caídas. Guarda además un historial para saber qué línea te falla más.
  Con Ollama instalado, los avisos llegan traducidos al español.

  Desde el panel, detrás del login de Umbrel, pegas tu clave de PRIM, emparejas
  el iPhone con un código QR y ves la cuota del día. La app del iPhone se
  instala aparte, por ejemplo con IPA Station.

  Necesitas una clave gratuita del portal PRIM
  (https://prim.iledefrance-mobilites.fr). Se pega en el panel, que la prueba
  antes de guardarla y la guarda cifrada.

releaseNotes: >-
  Tus paradas, sin rutas. La app del iPhone pasa a ser una sola pantalla con
  tus paradas. Para un tren eliges de dónde sales y a dónde vas, y ves la vía,
  la vía probable y a qué hora llegas. Para un bus eliges la parada y ves si
  llega tarde; con «Paradas cerca de ti» salen las que tienes al lado. Tus
  rutas guardadas se copian una vez como paradas, sin borrar nada, y el
  servidor aprende de tus paradas igual que aprendía de las rutas.

  Lo de antes sigue igual:

  Paradas sueltas. Ahora puedes añadir al tablero una parada y una línea —el
  bus de la esquina, el tranvía del trabajo— sin que sea parte de ninguna
  ruta, y ver sus próximos pasos en tiempo real junto a tus trenes. Se añaden
  desde la app del iPhone, con el «+» del Tablero. Caben ocho.

  Lo de la 0.4.1 sigue igual:

  El tablero aprende por la parada donde te bajas. Hasta ahora enseñaba los
  trenes que iban a un destino concreto; ahora aprende qué trenes paran en tu
  estación de bajada y los enseña todos, vayan a donde vayan, con la hora a
  la que llegan. Tarda unos días en aprenderlo; mientras, funciona como antes.

  Vía. La previsión mira ahora qué hizo ese mismo tren el mismo día de la
  semana, propone una segunda vía probable y dice por qué zona de vías suelen
  salir los trenes que paran en tu estación.

  Buses y tranvías. El servidor sigue cada paso hasta que pasa para saber
  cómo suele ir (retraso habitual y cuánto se queda corto el cartel), dice a
  cuántas paradas está el vehículo y distingue el dato en directo del que es
  solo horario. Los pasos que el operador da por perdidos ya no salen.

  Enlace entre tramos. Con cada tren, qué bus o tranvía coges al bajar, con
  cuánto margen, y a qué hora llegas al final de la ruta. Vale para cualquier
  combinación de tramos.

  Horario de respaldo. Si una línea no manda tiempo real, el tramo enseña el
  horario oficial en vez de quedarse vacío.

  La app del iPhone de ahora sigue funcionando igual; lo nuevo se irá viendo
  en ella en su próxima versión. Actualizar no borra nada: la base de datos
  se pone al día sola y deja una copia de seguridad al lado.

