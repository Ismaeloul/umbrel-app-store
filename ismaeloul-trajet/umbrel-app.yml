manifestVersion: 1
id: ismaeloul-trajet
category: automation
icon: "https://raw.githubusercontent.com/Ismaeloul/umbrel-app-store/main/ismaeloul-trajet/icon.svg"
name: Trajet
version: "0.4.0"
tagline: Tus trayectos de Île-de-France en tiempo real, en el iPhone
description: >-
  Trajet muestra los próximos pasos de tus trayectos habituales en transporte
  público de Île-de-France, con los datos en tiempo real del portal PRIM de
  Île-de-France Mobilités. Esta app es el servidor de la app de iPhone Trajet
  y su panel de control.

  Guardas tus rutas (Casa → Trabajo, la vuelta desde clase…) con sus tramos y
  transbordos, y la app enseña sola la que toca según el día de la semana y la
  hora. Por cada tramo verás los próximos pasos con los minutos que faltan en
  grande, el destino, el andén cuando la red lo publica (y una vía probable,
  aprendida, cuando todavía no) y el retraso. Siempre dice de cuándo es el
  dato que estás viendo.

  Si una de tus líneas está perturbada o interrumpida, calcula rutas
  alternativas evitándola y comprueba que las líneas de la alternativa tampoco
  estén caídas. Guarda además un historial para saber qué línea te falla más.
  Con Ollama instalado, los avisos llegan traducidos al español.

  Desde el panel, detrás del login de Umbrel, pegas tu clave de PRIM, emparejas
  el iPhone con un código QR y ves la cuota del día. La app del iPhone se
  instala aparte, por ejemplo con IPA Station.

  Necesitas una clave gratuita del portal PRIM
  (https://prim.iledefrance-mobilites.fr). Se pega en el panel, que la prueba
  antes de guardarla y la guarda cifrada.

releaseNotes: >-
  Trajet ya es una app de iPhone. La web de siempre se despide: la app de
  verdad es ahora la nativa del iPhone, y esta app de Umbrel pasa a ser su
  servidor y su panel. Al abrir Trajet desde Umbrel ya no ves el tablero, sino
  el panel.

  Emparejar con un QR. En el panel generas un código QR, lo escaneas con el
  iPhone y listo: la app se lleva las direcciones de casa y de Tailscale y su
  propio pase. El código vale cinco minutos y un solo uso, y cada iPhone
  emparejado se puede renombrar o desconectar desde el panel cuando quieras.

  El panel, detrás del login de Umbrel. Solo entras tú. La parte que usa el
  iPhone queda fuera del login para que la app llegue sin sesión, pero no
  contesta a nada sin el pase del emparejamiento.

  La clave de PRIM, en el panel. Ya no hay que meterla en ninguna variable: la
  pegas en el panel, Trajet la prueba contra PRIM antes de guardarla y la
  guarda cifrada. Nunca sale del servidor; el panel solo enseña sus cuatro
  últimos caracteres.

  Cuota sin sustos. Trajet cuenta las llamadas del día y, cuando se acerca a
  las 1000, refresca más despacio y tira de lo que ya tiene en vez de quedarse
  en blanco. La pantalla nunca se vacía: como mucho, dice de cuándo es el dato.

  Mapa de la ruta. Los trazados de las líneas, las paradas y los accesos de
  las estaciones salen de los datos abiertos de Île-de-France Mobilités, sin
  clave y sin gastar cuota de PRIM.

  Actualizar no borra nada. La base de datos se pone al día sola al arrancar y
  deja una copia de seguridad al lado; tus rutas, el historial y los andenes
  aprendidos siguen ahí.

  Antes de actualizar hay que publicar la imagen 0.4.0 en el NAS con
  scripts/publish.sh del repo del servidor.

