name: Saldo
version: "0.1.3"
tagline: Cuánto te dura el saldo prepago de tus cuentas de tiendas de apps
description: >-
  Saldo lleva la cuenta del prepago y las suscripciones de tus cuentas de App
  Store, Google Play y demás tiendas, cuando no quieres meter la tarjeta y
  prefieres recargar con saldo.

  De un vistazo sabes cuánto te dura cada cuenta, qué día se agota y qué día
  tienes que recargar para que no falle un cobro. El cálculo no es una media:
  la app simula cobro a cobro las fechas reales de cada suscripción, así que
  una anual que cae dentro de tres meses te deja el margen en tres meses
  aunque «de media» el saldo diera para ocho.

  Cada cuenta tiene su divisa, con los decimales que le tocan por la norma
  ISO 4217: euros con dos, yenes sin ninguno, dinares con tres. Nunca se
  mezclan divisas ni se convierte nada.

  Todos los datos los metes tú a mano. La app no habla con Apple ni con
  Google, no pide credenciales de ninguna tienda: es un simulador de saldo,
  no un lector. Sin usuarios ni contraseñas, pensada para entrar por la red
  privada.

releaseNotes: >-
  El aviso de poco saldo ahora insiste TODOS los días hasta que recargues, en
  vez de decírtelo una vez y callarse. En Ajustes hay un campo nuevo,
  «Recordármelo cada… (días)», por si prefieres que no sea tan pesado.

