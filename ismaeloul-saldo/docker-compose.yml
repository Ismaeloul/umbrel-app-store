version: "3.7"

# Formato de app de Umbrel. Este es el UNICO compose de la carpeta: umbreld
# hace `docker pull` de cada `image:` antes de arrancar nada e ignora
# `pull_policy`, asi que aqui jamas puede haber un `build:`.
#
# La imagen la construye y la publica GitHub Actions en cada push que toque
# `saldo/`, y vive en ghcr.io, que es publico: el NAS se la baja sin
# credenciales y sin tener que construir nada a mano.

services:
  app_proxy:
    environment:
      APP_HOST: ismaeloul-saldo_web_1
      APP_PORT: "3000"
      # App personal en la red privada: sin login extra por delante.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/ismaeloul/saldo:0.1.2
    container_name: ismaeloul-saldo_web_1
    restart: unless-stopped
    init: true
    environment:
      PORT: "3000"
      TZ: "Europe/Madrid"
      SALDO_DATA_DIR: "/app/data"
    volumes:
      # Aqui vivira saldo.db. Es lo unico que habra que respaldar, y sobrevive
      # a las actualizaciones de la app.
      - ${APP_DATA_DIR}/data:/app/data
    mem_limit: 512m
    pids_limit: 128
