# Compose de desarrollo y de prueba en local: construye la imagen y publica
# el puerto directamente. El compose con el formato de app de Umbrel (con el
# servicio app_proxy) esta en umbrel/docker-compose.yml y se explica en el
# README.
services:
  saldo:
    build: .
    container_name: saldo
    restart: unless-stopped
    init: true
    environment:
      PORT: "${PORT:-8080}"
      TZ: "Europe/Paris"
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      # La base de datos vive aqui. Es lo unico que hay que respaldar.
      - ./data:/app/data
    mem_limit: 512m
    pids_limit: 128
