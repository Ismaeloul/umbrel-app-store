releaseNotes: >-
  Los servidores vuelven a arrancar solos tras reiniciar el Umbrel o actualizar
  CraftDeck (se recuerda cuáles estaban encendidos; se puede desactivar por
  servidor en Mundo → Rendimiento). Panel usable desde el móvil, con menú
  lateral plegable. Tarjeta «Dirección para tus amigos» en el Dashboard con
  botón de copiar. Flags de JVM de Aikar por defecto: menos tirones de lag con
  la misma RAM. El túnel de playit.gg puede arrancar solo con CraftDeck. Aviso
  de RAM al crear o ajustar un servidor, comparando con la memoria libre real
  del Umbrel. Si la creación de un servidor falla, ahora se ve el error y hay
  botón de reintentar. Consola con historial de comandos (flecha arriba), hora
  real de cada línea y las últimas líneas de latest.log al abrir el panel.
  Icono en la tienda, arreglo del guardado de archivos grandes en el editor y
  de la «próxima ejecución» de las tareas de cada 2 h o más.
