port: 8449
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: Ismaeloul
submission: https://github.com/Ismaeloul/craftdeck
releaseNotes: >-
  Reinicio automático tras crash: si el servidor se cae, CraftDeck lo levanta
  solo (máximo 3 veces en 10 minutos para no entrar en bucle) y te dice en
  Discord y en el panel qué mod tiene la culpa, con un botón para desactivarlo
  desde Diagnóstico. Sección de Mods rediseñada con pestañas Explorar e
  Instalados (buscador siempre arriba, filtro de instalados y «Actualizar
  todo»). Restaurar backups ahora funciona en umbrelOS, el guardado del mundo
  se espera de verdad antes de comprimir y los horarios (backup de las 04:00,
  eventos) corren en hora local en vez de UTC. Parada más segura para mundos
  grandes y varios arreglos de robustez más.
