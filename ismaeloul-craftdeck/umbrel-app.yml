defaultPassword: ""
submitter: Ismaeloul
submission: https://github.com/Ismaeloul/craftdeck
releaseNotes: >-
  Explorador de mods renovado: paginación completa del catálogo de Modrinth,
  filtros por categoría, orden configurable, filtro «solo compatibles con
  servidor» y ocultado de librerías. El pack para amigos ahora se descarga
  como un único .zip con todos los mods activos.
