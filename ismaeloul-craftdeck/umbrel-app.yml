releaseNotes: >-
  Servidores Paper (plugins de Modrinth, sin que tus amigos instalen nada) y
  cambio de versión de Minecraft conservando el mundo: se hace un backup, se
  reinstala el servidor y los mods se pasan a una versión compatible (los que no
  la tienen se desactivan y te lo dice). Un servidor vanilla se puede pasar a
  Paper con el mismo mundo. Crear un servidor desde un modpack de Modrinth
  (.mrpack) en un clic, y exportar el pack de amigos también como .mrpack para
  que Prism, Modrinth App o ATLauncher monten el cliente solos. Mapa en vivo con
  BlueMap: se instala, se configura y se ve dentro del panel. Subir al servidor
  un mundo, un backup o un .jar arrastrándolo. Restaurar un backup ahora devuelve
  solo el mundo por defecto (o todo, si lo eliges). Hora y días del backup
  automático a tu gusto. Página «Todos los servidores» para arrancar y parar
  cualquiera. Jugadores con su cara, historial de entradas y salidas y última
  vez visto. Consola con filtro de avisos/errores y buscador. Si usas playit, el
  túnel detectado se puede poner como dirección pública con un botón. Los crash
  reports viejos se borran solos y el tiempo en línea de cada jugador avanza.
