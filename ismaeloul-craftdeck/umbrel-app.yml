releaseNotes: >-
  Modo dormido: si el servidor lleva un rato sin nadie se apaga y libera la RAM
  del Umbrel; mientras duerme, en la lista de servidores de tus amigos sale
  «dormido» y, cuando alguien intenta entrar, se arranca solo. Pack de amigos
  con solo los mods que hacen falta para entrar (los de solo servidor se quedan
  fuera; los opcionales, a elegir), y los mods instalados con su icono.
  Datapacks desde Modrinth (también para servidores vanilla). Pregenerar el
  mundo con Chunky. Desbanear y dar OP o banear sin que el jugador esté
  conectado. Acciones rápidas en la consola (día, noche, sol, lluvia…). Icono
  del servidor y MOTD con colores y vista previa. TPS en el Dashboard (Paper) y
  gráficas de 1 h y 24 h. Almacenamiento que ocupa CraftDeck en el disco. Clonar
  un servidor a otro puerto. Descargar los logs desde Diagnóstico. Capturas en
  la tienda.


  De la 0.6: servidores Paper, cambio de versión conservando el mundo, modpacks
  .mrpack, mapa en vivo con BlueMap, subir mundos, backups y .jar, restaurar
  solo el mundo, horario del backup, página «Todos los servidores», historial de
  jugadores y filtro de consola.
