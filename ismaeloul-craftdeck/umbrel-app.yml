name: CraftDeck
icon: "https://raw.githubusercontent.com/Ismaeloul/umbrel-app-store/main/ismaeloul-craftdeck/icon.svg"
version: "0.6.0"
tagline: Crea y modera tu servidor de Minecraft desde el navegador
description: >-
  Panel de control de servidores de Minecraft para umbrelOS. Crea servidores
  Vanilla, Paper (plugins), Fabric, Forge o NeoForge eligiendo la versión de una
  lista, o directamente desde un modpack de Modrinth; CraftDeck descarga Java y
  el servidor por ti. Arráncalos y páralos desde el navegador (también desde el
  móvil), mira la consola en vivo, ejecuta comandos, gestiona jugadores (OP,
  kick, ban, whitelist, historial de conexiones), instala mods y plugins de
  Modrinth con sus dependencias, mira tu mundo en 3D con BlueMap, edita
  server.properties de forma visual y haz backups con un click o automáticos a
  la hora que quieras.


  Tus amigos se conectan a la dirección que te enseña el Dashboard (la de casa o
  la pública, si entran por una redirección del router). Si el Umbrel se
  reinicia, los servidores que estaban encendidos vuelven solos.
