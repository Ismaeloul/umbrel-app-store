# IMPORTANTE: umbrelOS actualiza docker-compose.yml y umbrel-app.yml, pero una
# actualizacion no garantiza que copie carpetas nuevas a APP_DATA_DIR. El hook
# nativo hooks/pre-start restaura releases/<version>/ desde un tag inmutable en
# el propio NAS antes de que Compose arranque los servicios.

services:
  app_proxy:
    environment:
      APP_HOST: ismaeloul-ace-player-neo_nginx_1
      APP_PORT: "80"
      PROXY_AUTH_ADD: "true"

  acestream:
    # Docker Hub solo publica la etiqueta "latest" de esta imagen; el digest
    # fija la version exacta del motor que se ha probado.
    image: wafy80/acestream@sha256:8ffbc03916d8e33d321430f9ca1731ef3b058e72eeb9d9f7b322e9f7de654edc
    container_name: ismaeloul-ace-player-neo_acestream_1
    restart: unless-stopped
    # cache en disco (no en RAM) y subida P2P acotada: evita que el motor
    # muera por OOM y que sature la conexion sirviendo a otros espectadores
    # El puerto P2P fijo permite aceptar conexiones entrantes; el buffering
    # interno acerca el comportamiento al reproductor de escritorio.
    command: --client-console --bind-all --port 8621 --use-internal-buffering 1 --live-cache-type disk --live-cache-size 1610612736 --upload-limit 2000
    ports:
      - "8621:8621/tcp"
      - "8621:8621/udp"
    # Hay RAM de sobra en el NAS: mas colchon de buffer = menos cortes cuando
    # el enjambre va justo de pares.
    mem_limit: 4g

  # Motor independiente para probar hashes en segundo plano. No se publica a
  # nginx ni al navegador: el backend abre una fuente cada vez, lee una muestra
  # corta y cierra siempre la sesion. Asi nunca interfiere con el canal visible.
  acestream_scanner:
    image: wafy80/acestream@sha256:8ffbc03916d8e33d321430f9ca1731ef3b058e72eeb9d9f7b322e9f7de654edc
    container_name: ismaeloul-ace-player-neo_acestream_scanner_1
    restart: unless-stopped
    # Sin puertos publicados: abre sesiones cortas y las cierra, no necesita
    # pares entrantes. Un puerto menos abierto en la LAN.
    command: --client-console --bind-all --port 8622 --use-internal-buffering 1 --live-cache-type disk --live-cache-size 536870912 --upload-limit 1000
    mem_limit: 3g

  # Un proxy minimo y no expuesto conserva el socket de Docker fuera del
  # backend web. Solo acepta reiniciar el contenedor AceStream concreto.
  engine_control:
    image: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    container_name: ismaeloul-ace-player-neo_engine_control_1
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      ACESTREAM_CONTAINER: "ismaeloul-ace-player-neo_acestream_1"
      # Solo el backend conoce este secreto: cualquier otro contenedor del NAS
      # comparte la red de Docker y sin el no puede pedir reinicios.
      ENGINE_CONTROL_TOKEN: "${APP_SEED}"
    command: node /releases/0.6.59/engine-control.js
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 128m
    pids_limit: 64

  storage:
    image: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    container_name: ismaeloul-ace-player-neo_storage_1
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    environment:
      NODE_ENV: production
      # Cambiar a "true" solo si se necesitan listas alojadas en la LAN.
      ALLOW_PRIVATE_SYNC_URLS: "false"
      # La clave publica muestra una cobertura reducida. Se puede definir una
      # clave propia de TheSportsDB en el entorno sin exponerla al navegador.
      THESPORTSDB_API_KEY: "${THESPORTSDB_API_KEY:-123}"
      FOOTBALL_COUNTRY: "Spain"
      FOOTBALL_DAYS: "14"
      ACESTREAM_HOST: "ismaeloul-ace-player-neo_acestream_1"
      ACESTREAM_SCANNER_HOST: "ismaeloul-ace-player-neo_acestream_scanner_1"
      ACESTREAM_SCANNER_PORT: "6878"
      ACESTREAM_SCANNER_TIMEOUT_MS: "24000"
      ACESTREAM_SCANNER_SAMPLE_BYTES: "131072"
      # Un fallo no cambia unos segundos despues: la segunda comprobacion se
      # aplaza diez minutos para dejar libre el motor para otras fuentes.
      ACESTREAM_SCANNER_RETRY_DELAY_MS: "600000"
      ENGINE_CONTROL_HOST: "ismaeloul-ace-player-neo_engine_control_1"
      ENGINE_CONTROL_TOKEN: "${APP_SEED}"
      # Ollama vive como otra app de Umbrel. Solo el backend recibe esta ruta:
      # el navegador nunca habla directamente con el modelo.
      OLLAMA_BASE_URL: "http://host.docker.internal:11434"
      OLLAMA_EMBED_MODEL: "embeddinggemma:300m-qat-q4_0"
      OLLAMA_TIMEOUT_MS: "12000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ffmpeg: re-empaqueta HEVC de TS a fMP4 para iOS (sin transcodificar).
    # Los paquetes quedan en apk-cache, asi que tras la primera instalacion
    # ffmpeg se reinstala sin internet. Si aun asi falla, la app funciona
    # igual (solo se pierde la adaptacion para iPhone de canales HEVC).
    command: sh -c "apk add ffmpeg >/dev/null 2>&1 || echo 'sin ffmpeg, remux iOS desactivado'; exec node /releases/0.6.59/server.js"
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/apk-cache:/etc/apk/cache
    # /api/health responde en cuanto el servidor escucha; el start_period
    # cubre la instalacion de ffmpeg. nginx no arranca hasta que esto es sano.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 90s
    mem_limit: 768m
    pids_limit: 128

  nginx:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    container_name: ismaeloul-ace-player-neo_nginx_1
    restart: unless-stopped
    depends_on:
      acestream:
        condition: service_started
      storage:
        condition: service_healthy
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
    command: >
      sh -c "rm -rf /www && mkdir -p /www &&
             cp -r /releases/0.6.59/. /www/ &&
             cp /www/nginx.conf /etc/nginx/conf.d/default.conf &&
             exec nginx -g 'daemon off;'"
