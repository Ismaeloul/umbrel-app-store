version: "3.7"

# IMPORTANTE: umbrelOS actualiza docker-compose.yml y umbrel-app.yml, pero una
# actualizacion no garantiza que copie carpetas nuevas a APP_DATA_DIR. Cada
# version sigue viviendo en releases/<version>/ y release_sync la descarga desde
# un tag inmutable antes de arrancar los servicios que la necesitan.

services:
  app_proxy:
    environment:
      APP_HOST: ismaeloul-ace-player-neo_nginx_1
      APP_PORT: "80"
      PROXY_AUTH_ADD: "true"

  # Las instalaciones existentes pueden recibir el Compose nuevo sin la carpeta
  # de release. Este servicio idempotente conserva cualquier copia completa y,
  # si falta, restaura la version etiquetada antes de iniciar backend y Nginx.
  release_sync:
    image: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    restart: "no"
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: >-
      sh -eu -c '
        target=/releases/0.6.10;
        required="engine-control.js icon.svg index.html nginx.conf server.js vendor/hls.min.js vendor/mpegts.js vendor/fonts/inter-var.woff2 vendor/fonts/jetbrains-mono-var.woff2 vendor/fonts/outfit-var.woff2";
        ready=true;
        for file in $$required; do
          if [ ! -s "$$target/$$file" ]; then ready=false; break; fi;
        done;
        if [ "$$ready" = true ]; then
          touch "$$target/.complete";
          exit 0;
        fi;
        staging="$$(mktemp -d /tmp/ace-release.XXXXXX)";
        wget -qO- "https://github.com/Ismaeloul/umbrel-app-store/archive/refs/tags/ace-player-neo-v0.6.10.tar.gz" |
          tar -xz -C "$$staging" --strip-components=4
          "umbrel-app-store-ace-player-neo-v0.6.10/ismaeloul-ace-player-neo/releases/0.6.10";
        for file in $$required; do test -s "$$staging/$$file"; done;
        mkdir -p "$$target";
        cp -a "$$staging/." "$$target/";
        touch "$$target/.complete";
      '
    volumes:
      - ${APP_DATA_DIR}/releases:/releases
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    mem_limit: 128m
    pids_limit: 64

  acestream:
    image: wafy80/acestream@sha256:8ffbc03916d8e33d321430f9ca1731ef3b058e72eeb9d9f7b322e9f7de654edc
    container_name: ismaeloul-ace-player-neo_acestream_1
    restart: unless-stopped
    # cache en disco (no en RAM) y subida P2P acotada: evita que el motor
    # muera por OOM y que sature la conexion sirviendo a otros espectadores
    # El puerto P2P fijo permite aceptar conexiones entrantes; el buffering
    # interno acerca el comportamiento al reproductor de escritorio.
    command: --client-console --bind-all --port 8621 --use-internal-buffering 1 --live-cache-type disk --live-cache-size 536870912 --upload-limit 2000
    ports:
      - "8621:8621/tcp"
      - "8621:8621/udp"
    mem_limit: 2g

  # Un proxy minimo y no expuesto conserva el socket de Docker fuera del
  # backend web. Solo acepta reiniciar el contenedor AceStream concreto.
  engine_control:
    image: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    container_name: ismaeloul-ace-player-neo_engine_control_1
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      release_sync:
        condition: service_completed_successfully
    command: node /releases/0.6.10/engine-control.js
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
      - /var/run/docker.sock:/var/run/docker.sock
    mem_limit: 128m
    pids_limit: 64

  storage:
    image: node:24.19.0-alpine3.24@sha256:d32cdf619f63fe0471182d08996dd516c6275bb5fd31ae06e55a570bd9e1ad43
    container_name: ismaeloul-ace-player-neo_storage_1
    restart: unless-stopped
    init: true
    depends_on:
      release_sync:
        condition: service_completed_successfully
      engine_control:
        condition: service_started
    working_dir: /app
    environment:
      NODE_ENV: production
      # Cambiar a "true" solo si se necesitan listas alojadas en la LAN.
      ALLOW_PRIVATE_SYNC_URLS: "false"
      # La clave publica muestra una cobertura reducida. Se puede definir una
      # clave propia de TheSportsDB en el entorno sin exponerla al navegador.
      THESPORTSDB_API_KEY: "${THESPORTSDB_API_KEY:-123}"
      FOOTBALL_COUNTRY: "Spain"
      FOOTBALL_DAYS: "5"
    # ffmpeg: re-empaqueta HEVC de TS a fMP4 para iOS (sin transcodificar).
    # Si no hay internet al recrear el contenedor, la app funciona igual
    # (solo se pierde la adaptacion para iPhone de canales HEVC).
    command: sh -c "apk add --no-cache ffmpeg >/dev/null 2>&1 || echo 'sin ffmpeg, remux iOS desactivado'; exec node /releases/0.6.10/server.js"
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
      - ${APP_DATA_DIR}/data:/data
    mem_limit: 768m
    pids_limit: 128

  nginx:
    image: nginx:1.30.4-alpine3.24@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    container_name: ismaeloul-ace-player-neo_nginx_1
    restart: unless-stopped
    depends_on:
      release_sync:
        condition: service_completed_successfully
      acestream:
        condition: service_started
      storage:
        condition: service_started
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
    command: >
      sh -c "rm -rf /www && mkdir -p /www &&
             cp -r /releases/0.6.10/. /www/ &&
             cp /www/nginx.conf /etc/nginx/conf.d/default.conf &&
             exec nginx -g 'daemon off;'"
