version: "3.7"

# IMPORTANTE: al actualizar una app, umbrelOS re-copia docker-compose.yml y
# umbrel-app.yml, y ANADE archivos nuevos a APP_DATA_DIR, pero NUNCA sobreescribe
# los existentes. Por eso cada version vive en releases/<version>/ (carpeta nueva
# = se copia siempre) y este compose apunta a ella. Para publicar una release:
# copiar releases/<vieja> a releases/<nueva>, editar alli, y cambiar la version
# en las DOS rutas de abajo y en umbrel-app.yml.

services:
  app_proxy:
    environment:
      APP_HOST: ismaeloul-ace-player-neo_nginx_1
      APP_PORT: "80"
      PROXY_AUTH_ADD: "true"

  acestream:
    image: wafy80/acestream@sha256:8ffbc03916d8e33d321430f9ca1731ef3b058e72eeb9d9f7b322e9f7de654edc
    container_name: ismaeloul-ace-player-neo_acestream_1
    restart: unless-stopped
    # cache en disco (no en RAM) y subida P2P acotada: evita que el motor
    # muera por OOM y que sature la conexion sirviendo a otros espectadores
    command: --client-console --bind-all --live-cache-type disk --live-cache-size 536870912 --upload-limit 2000
    mem_limit: 2g

  storage:
    image: node:20.19-alpine
    container_name: ismaeloul-ace-player-neo_storage_1
    restart: unless-stopped
    working_dir: /app
    # ffmpeg: re-empaqueta HEVC de TS a fMP4 para iOS (sin transcodificar).
    # Si no hay internet al recrear el contenedor, la app funciona igual
    # (solo se pierde la adaptacion para iPhone de canales HEVC).
    command: sh -c "apk add --no-cache ffmpeg >/dev/null 2>&1 || echo 'sin ffmpeg, remux iOS desactivado'; exec node /releases/0.6.7/server.js"
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
      - ${APP_DATA_DIR}/data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:1.27-alpine
    container_name: ismaeloul-ace-player-neo_nginx_1
    restart: unless-stopped
    depends_on:
      - acestream
      - storage
    volumes:
      - ${APP_DATA_DIR}/releases:/releases:ro
    command: >
      sh -c "rm -rf /www && mkdir -p /www &&
             cp -r /releases/0.6.7/. /www/ &&
             cp /www/nginx.conf /etc/nginx/conf.d/default.conf &&
             exec nginx -g 'daemon off;'"
