manifestVersion: 1
id: ismaeloul-ace-player-neo
category: media
icon: "https://raw.githubusercontent.com/Ismaeloul/umbrel-app-store/main/ismaeloul-ace-player-neo/icon.svg"
name: Ace Player Neo
version: "0.9.5"
tagline: Agenda de futbol con la señal de cada partido, en el navegador y en el iPhone
description: >-
  Ace Player Neo convierte tu Umbrel en un reproductor AceStream con agenda de
  futbol, biblioteca, favoritos, recientes, busqueda e importacion de listas.
  Se ve desde el navegador (tambien instalada como app en el movil) o desde la
  app de iPhone emparejada. El Umbrel se encarga del motor: comparte el canal
  entre dispositivos, cierra lo que ya nadie ve y lo reinicia solo si se
  cuelga.
releaseNotes: >-
  Ver juntos ya funciona desde fuera de casa. En la sala, Copiar
  enlace da una direccion https://sala.ismaeloul.es/s/... que tu amigo
  abre en el navegador desde donde este, sin instalar nada (en el iPhone
  la puede anadir a la pantalla de inicio). Pone su nombre y entra.

  Desde fuera solo se ve la sala: ni tus canales, ni tus ajustes, ni el
  resto del Umbrel. Hace falta que sala.ismaeloul.es apunte a tu casa y
  que la Freebox mande el puerto 443 al 8443 del Umbrel. La primera vez
  que arranca, el certificado de seguridad tarda un minuto en salir y
  despues se renueva solo.
