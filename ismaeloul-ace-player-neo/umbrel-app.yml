manifestVersion: 1
id: ismaeloul-ace-player-neo
category: media
icon: "https://raw.githubusercontent.com/Ismaeloul/umbrel-app-store/main/ismaeloul-ace-player-neo/icon.svg"
name: Ace Player Neo
version: "0.9.3"
tagline: Agenda de futbol con la señal de cada partido, en el navegador y en el iPhone
description: >-
  Ace Player Neo convierte tu Umbrel en un reproductor AceStream con agenda de
  futbol, biblioteca, favoritos, recientes, busqueda e importacion de listas.
  Se ve desde el navegador (tambien instalada como app en el movil) o desde la
  app de iPhone emparejada. El Umbrel se encarga del motor: comparte el canal
  entre dispositivos, cierra lo que ya nadie ve y lo reinicia solo si se
  cuelga.
releaseNotes: >-
  Ahora se pueden ver a la vez la IPTV y AceStream: si alguien esta
  viendo tu IPTV, otra persona puede ver un canal de AceStream en otro
  dispositivo (y al reves), sin que se corten. Dos canales distintos de
  la IPTV siguen sin poder verse a la vez (tu cuenta admite una
  conexion), y lo mismo con AceStream.

  Al entrar en un partido o en un canal, la app ya no le quita la IPTV
  a quien la esta viendo: arranca sola por AceStream y te dice quien la
  tiene. Si tocas tu la fuente a mano, se la quitas como siempre. En la
  app de iPhone esto ultimo llegara mas adelante.
