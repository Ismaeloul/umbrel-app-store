name: Ace Player Neo
version: "1.1.0"
tagline: Agenda de futbol con la señal de cada partido, en el navegador y en el iPhone
description: >-
  Ace Player Neo convierte tu Umbrel en un reproductor AceStream con agenda de
  futbol, biblioteca, favoritos, recientes, busqueda e importacion de listas.
  Se ve desde el navegador (tambien instalada como app en el movil) o desde la
  app de iPhone emparejada. El Umbrel se encarga del motor: comparte el canal
  entre dispositivos, cierra lo que ya nadie ve y lo reinicia solo si se
  cuelga.
releaseNotes: >-
  Version 1.1.0. La web del movil, rediseñada: barra flotante abajo con el
  mini reproductor dentro, lupa y ajustes arriba, Agenda por competicion,
  ficha del partido con el video arriba y las fuentes debajo, Canales con lo
  que echan ahora, Guia con detalles al tocar un programa y Pelis y series
  desde Mi lista. Al abrir un partido en el movil solo arranca sola una
  AceStream, y en silencio; la IPTV espera a que toques para no ocupar tu
  conexion. En el ordenador no cambia nada.
