manifestVersion: 1
id: ismaeloul-ace-player-neo
category: media
icon: "https://raw.githubusercontent.com/Ismaeloul/umbrel-app-store/main/ismaeloul-ace-player-neo/icon.svg"
name: Ace Player Neo
version: "0.9.2"
tagline: Agenda de futbol con la señal de cada partido, en el navegador y en el iPhone
description: >-
  Ace Player Neo convierte tu Umbrel en un reproductor AceStream con agenda de
  futbol, biblioteca, favoritos, recientes, busqueda e importacion de listas.
  Se ve desde el navegador (tambien instalada como app en el movil) o desde la
  app de iPhone emparejada. El Umbrel se encarga del motor: comparte el canal
  entre dispositivos, cierra lo que ya nadie ve y lo reinicia solo si se
  cuelga.
releaseNotes: >-
  La app de iPhone ya puede ver tu IPTV, la Guia TV y Peliculas y
  series.

  Los escudos de todos los equipos se descargan solos y aparecen al
  momento, sin confundir equipos que se llaman igual en ligas distintas.

  Los canales de IPTV entrelazados (1080i) se ven fluidos en el iPhone:
  el Umbrel los pasa a 1080p a 50 imagenes por segundo, sin bajar la
  calidad. Solo cuando los ve un iPhone; en el navegador no cambia nada.

  El QR para emparejar el iPhone funciona aunque abras la web por
  Tailscale y el iPhone este en casa (o al reves).
