name: Ace Player Neo
version: "0.10.0"
tagline: Agenda de futbol con la señal de cada partido, en el navegador y en el iPhone
description: >-
  Ace Player Neo convierte tu Umbrel en un reproductor AceStream con agenda de
  futbol, biblioteca, favoritos, recientes, busqueda e importacion de listas.
  Se ve desde el navegador (tambien instalada como app en el movil) o desde la
  app de iPhone emparejada. El Umbrel se encarga del motor: comparte el canal
  entre dispositivos, cierra lo que ya nadie ve y lo reinicia solo si se
  cuelga.
releaseNotes: >-
  Rediseño de escritorio (primera parte): menu lateral con la Agenda, los
  Canales, la Guia, Pelis y series y Ver juntos, logo nuevo y buscador con
  Ctrl K. La Agenda va en dos paneles: los partidos por competicion a la
  izquierda y, al tocar uno, su ficha con el video y las fuentes en filas al
  lado. El reproductor del ordenador queda limpio: el partido, la fuente que
  suena (tocala para ver todas), pausa y una sola pildora DIRECTO; si la
  fuente se corta salta a la siguiente con un aviso para deshacerlo. En el
  movil no cambia nada.
