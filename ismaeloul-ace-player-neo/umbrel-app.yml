manifestVersion: 1
id: ismaeloul-ace-player-neo
category: media
icon: "https://raw.githubusercontent.com/Ismaeloul/umbrel-app-store/main/ismaeloul-ace-player-neo/icon.svg"
name: Ace Player Neo
version: "0.6.12"
tagline: Nuevo reproductor AceStream para Umbrel
description: >-
  Ace Player Neo convierte tu Umbrel en un reproductor AceStream web con
  biblioteca, favoritos, recientes, importacion de listas, agenda de futbol y
  proxy local para reproducir los streams desde el navegador.
releaseNotes: >-
  Hace permanente la reparacion de actualizaciones mediante el hook nativo de
  pre-arranque de Umbrel. El NAS verifica la release 0.6.12, la restaura desde
  la tienda local y usa su tag inmutable como respaldo, sin cronjobs y sin tocar
  la biblioteca, las preferencias ni el historial.
