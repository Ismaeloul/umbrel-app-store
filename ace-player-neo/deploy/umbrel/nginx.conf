# nginx de Ace Player Neo 0.7.0. Compose la copia a conf.d/default.conf, que el
# nginx.conf de la imagen incluye dentro de http{}: por eso aqui caben map y
# log_format. Los nombres de contenedor son los de produccion
# (ismaeloul-ace-player-neo_<servicio>_1) y tienen que coincidir con Compose.

# Origen de la peticion, calculado sobre la URI CRUDA y nunca por location. La
# pasarela de umbreld deja pasar sin login lo que casa con /native/* mirando la
# ruta ya normalizada por new URL(), pero reenvia la URL original; nginx la
# decodifica y normaliza a su manera, asi que /native/..%2fapi/state acabaria en
# location /api/ sin haber pasado el login.
# Mas estricto que arquitectura §8.2 ("~^/native(/|\?|$)"), a proposito:
# - sin distinguir mayusculas: si la pasarela casara /NATIVE/* con la lista
#   blanca, esa peticion tambien entraria sin login;
# - cualquier cosa que empiece por /native (/native;..., /nativeX): ninguna ruta
#   legitima de la web empieza asi.
# Todo eso cuenta como native y, fuera de location /native/, recibe un 403 en
# vez de tratarse como web.
map $request_uri $ace_origin {
  "~*^/native"  native;
  default       web;
}

# URIs que ninguna ruta legitima de la app lleva: %2f, %2e, %5c, ".." o "\" en
# la parte de la RUTA. La query no cuenta: una busqueda "A/B" lleva %2F y es
# legitima. "\" se escribe \x5c porque nginx se come las barras invertidas de
# sus cadenas antes de compilar la expresion regular.
# Tampoco una URI que empieza por "//" (docs/seguridad.md, S-01): la pasarela
# toma lo que va entre las dos primeras barras y la siguiente como un HOST y
# decide con el resto, asi que //api/native/state casa con /native/* y pasa sin
# login; nginx junta las barras y la manda a location /api/ como web (y
# //ace/native/... al motor). Ningun cliente legitimo pide "//...".
map $request_uri $ace_bad_uri {
  "~*^[^?]*%(2f|2e|5c)"  1;
  "~^[^?]*(\.\.|\x5c)"   1;
  "~^//"                 1;
  default                0;
}

# El mismo id de peticion sale aqui y en el log de Node (nginx lo manda en
# X-Request-Id). Se registra la ruta sin la query: las URL de video de la app
# nativa llevan el token firmado en ?t= y no deben quedar en los logs.
log_format aceneo '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'origin=$ace_origin rid=$request_id rt=$request_time';

server {
  listen 80;
  server_tokens off;
  client_max_body_size 2m;
  access_log /var/log/nginx/access.log aceneo;
  # Las redirecciones salen relativas. Con el valor por defecto (on) nginx
  # vuelve a convertir en absoluta cualquier Location que empiece por "/",
  # tambien la que deja el proxy_redirect de /ace/, con http:// y sin el puerto
  # 7792: el arreglo de la 0.6.59 se deshacia en el nginx real (visto en la
  # prueba con Docker, scripts/test-nginx-docker.mjs).
  absolute_redirect off;

  # Capa 1 del blindaje: se corta antes de elegir location.
  if ($ace_bad_uri) {
    return 400;
  }

  # El index, el JSON de la agenda y del estado y los assets sin .gz viajan
  # comprimidos. Los streams (/ace/, /content/, /remux/, /native/) y el SSE lo
  # desactivan en su location. text/html no se lista: nginx lo comprime siempre
  # y repetirlo solo daba un aviso al arrancar.
  gzip on;
  gzip_types application/json application/javascript text/css application/manifest+json image/svg+xml;
  gzip_min_length 1024;
  gzip_vary on;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Robots-Tag noindex always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'" always;

  # ---------------------------------------------------------------------------
  # App nativa (iOS). Entra sin el login de Umbrel: todo va a Node quitando el
  # prefijo y Node exige el token del dispositivo en cualquier ruta. El origen
  # va fijo: aunque una URI rara acabara aqui, nunca se trata como web.
  # ---------------------------------------------------------------------------
  # Sin esto, nginx responde a "/native" (sin barra) con un 301 a "/native/".
  location = /native {
    return 403;
  }

  location /native/ {
    gzip off;
    proxy_pass http://ismaeloul-ace-player-neo_storage_1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Ace-Origin native;
    proxy_set_header X-Request-Id $request_id;
    # SSE y segmentos de video del remux: salen conforme Node los escribe.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # A partir de aqui, todo es solo para el origen web (con el login de Umbrel).
  # Capa 2: si una URI nativa acabara en otra location, se corta con 403. Toda
  # location que llega a Node fija X-Ace-Origin y X-Request-Id, asi que las que
  # mande el cliente se pisan siempre.

  # Tiempo real (SSE): sin buffer ni gzip, o los eventos llegan a trozos y tarde.
  location = /api/v1/events {
    if ($ace_origin = native) {
      return 403;
    }
    gzip off;
    proxy_pass http://ismaeloul-ace-player-neo_storage_1:3000/api/v1/events;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Ace-Origin $ace_origin;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /api/ {
    if ($ace_origin = native) {
      return 403;
    }
    proxy_pass http://ismaeloul-ace-player-neo_storage_1:3000/api/;
    # El backend compara Origin con Host para bloquear mutaciones de otro origen.
    proxy_set_header Host $http_host;
    proxy_set_header X-Ace-Origin $ace_origin;
    proxy_set_header X-Request-Id $request_id;
    # /api/remux puede tardar hasta 45 s en responder (espera el manifiesto)
    proxy_read_timeout 60s;
  }

  # Video IPTV de la web por hls.js (docs/iptv.md 6.6): los segmentos del remux
  # salen enteros, asi que sin buffer ni gzip, y sin una linea de log por
  # segmento, como /remux/.
  location /api/v1/video/ {
    if ($ace_origin = native) {
      return 403;
    }
    access_log off;
    gzip off;
    proxy_pass http://ismaeloul-ace-player-neo_storage_1:3000/api/v1/video/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Ace-Origin $ace_origin;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }

  location /remux/ {
    if ($ace_origin = native) {
      return 403;
    }
    # Cada segmento HLS del iPhone es una linea de log: fuera del registro.
    access_log off;
    gzip off;
    proxy_pass http://ismaeloul-ace-player-neo_storage_1:3000/remux/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Ace-Origin $ace_origin;
    proxy_set_header X-Request-Id $request_id;
    # Los segmentos ya son archivos completos; enviarlos conforme Node los
    # lee evita una segunda copia/buffer y reduce memoria y latencia en iOS.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }

  # Motor AceStream. La app nativa nunca habla con el motor: su video sale del
  # backend (remux con URL firmada).
  location /ace/ {
    if ($ace_origin = native) {
      return 403;
    }
    gzip off;
    proxy_pass http://ismaeloul-ace-player-neo_acestream_1:6878/ace/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    # Redireccion relativa: detras del HTTPS de Umbrel nginx solo ve http y
    # $scheme mandaba al navegador a http://, que en una pagina https se bloquea.
    proxy_redirect ~^http://[^/]+/(ace|content)/(.*)$ /$1/$2;
    sub_filter_types application/vnd.apple.mpegurl application/x-mpegURL audio/mpegurl text/plain;
    sub_filter_once off;
    sub_filter http://127.0.0.1:6878/ace/ /ace/;
    sub_filter http://localhost:6878/ace/ /ace/;
    sub_filter http://ismaeloul-ace-player-neo_acestream_1:6878/ace/ /ace/;
    sub_filter http://acestream:6878/ace/ /ace/;
    sub_filter http://127.0.0.1:6878/content/ /content/;
    sub_filter http://localhost:6878/content/ /content/;
    sub_filter http://acestream:6878/content/ /content/;
    sub_filter http://ismaeloul-ace-player-neo_acestream_1:6878/content/ /content/;
  }

  location /content/ {
    if ($ace_origin = native) {
      return 403;
    }
    gzip off;
    proxy_pass http://ismaeloul-ace-player-neo_acestream_1:6878/content/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_redirect ~^http://[^/]+/content/(.*)$ /content/$1;
  }

  # ---------------------------------------------------------------------------
  # Web estatica. /www solo contiene releases/<v>/web: ni el backend ni esta
  # configuracion se pueden descargar.
  # ---------------------------------------------------------------------------

  # nginx no conoce .webmanifest de serie y sin el tipo correcto el navegador
  # ignora el manifiesto y la app no se puede instalar en el movil.
  # Va en un location con default_type: un bloque types{} aqui SUSTITUIRIA el
  # mapa MIME entero y dejaria el css, el js y las fuentes sin tipo.
  location = /manifest.webmanifest {
    if ($ace_origin = native) {
      return 403;
    }
    root /www;
    default_type application/manifest+json;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag noindex always;
  }

  # El service worker debe revalidarse siempre: si se cachea, una release
  # nueva puede quedar servida por el worker viejo indefinidamente.
  location = /sw.js {
    if ($ace_origin = native) {
      return 403;
    }
    root /www;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag noindex always;
  }

  # Salida de Vite: el nombre lleva el hash del contenido, asi que se puede
  # cachear para siempre. Sin volver al index: un asset que falte da un 404 de
  # verdad y no un HTML que el navegador intenta ejecutar como JS. El .gz lo deja
  # el build junto a cada asset. Cache-Control sin "always": un 404 no se cachea.
  location /assets/ {
    if ($ace_origin = native) {
      return 403;
    }
    root /www;
    access_log off;
    gzip_static on;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag noindex always;
  }

  location / {
    if ($ace_origin = native) {
      return 403;
    }
    root /www;
    index index.html;
    try_files $uri $uri/ /index.html;
    # el index nunca se cachea: cada release se ve al instante tras actualizar.
    # add_header en un location anula los del server: se repiten los globales.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Robots-Tag noindex always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'" always;
  }
}
