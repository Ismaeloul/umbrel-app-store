                          anyOf:
                            - type: string
                              minLength: 2
                              maxLength: 8
                            - type: "null"
                        provider:
                          type: string
                          maxLength: 40
                        library:
                          maxItems: 20
                          type: array
                          items:
                            type: string
                            pattern: ^[a-f0-9]{40}$
                      required:
                        - id
                        - title
                        - quality
                        - provider
                        - library
                      additionalProperties: false
                required:
