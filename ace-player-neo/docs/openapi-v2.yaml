# GENERADO por packages/shared/scripts/openapi.ts desde src/routes.ts. No editar a mano.
openapi: 3.1.0
info:
  title: Ace Player Neo · API v1
  version: 0.9.0
  description: "Generado desde packages/shared/src/routes.ts con scripts/openapi.ts: no editar a mano. Cada ruta existe también bajo /native (la entrada de la app iOS, D4), con origen native. Las rutas antiguas /api/* están en docs/openapi.yaml."
servers:
  - url: /
    description: Web (tras el login de Umbrel)
  - url: /native
    description: App iOS (sin login de Umbrel; credencial propia)
tags:
  - name: state
  - name: net
  - name: iptv
  - name: directories
  - name: engine
  - name: playback
  - name: remux
  - name: scanner
  - name: sources
