  /api/v1/vod/titles/{id}/art/{art}:
    get:
      operationId: vodArt
      tags:
        - iptv
      summary: Cartel, fondo o fotograma de un título (JPEG, PNG o WebP) por el proxy propio
      description: "Solo recibe ids, nunca URLs (docs/vod.md §8, D-VOD8). Con la `v` correcta, `private, max-age=31536000, immutable`; sin ella o con otra, `private, no-cache`. `If-None-Match` da 304. Solo imágenes raster por bytes mágicos, con `nosniff` y `Content-Security-Policy: default-src 'none'`. Sin imagen, 404 `vod_not_found`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{40}$
        - name: art
          in: path
          required: true
          schema:
            type: string
            enum:
              - poster
              - backdrop
              - still
        - name: v
          in: query
          required: false
          schema:
            type: string
            pattern: ^[a-f0-9]{8}$
      responses:
        "200":
          description: "Cartel, fondo o fotograma en JPEG, PNG o WebP (por bytes mágicos), con `ETag`, `X-Content-Type-Options: nosniff` y `Content-Security-Policy: default-src 'none'`; inmutable con la `v` correcta y 304 con `If-None-Match` (docs/vod.md §8)."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          description: Error con el formato de /api/v1 (arquitectura §6.4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
        - umbrelGateway: []
