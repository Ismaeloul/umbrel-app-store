  /api/v1/vod/titles/{id}/stream:
    get:
      operationId: vodStream
      tags:
        - playback
      summary: Abrir una película o un episodio y recibir su lista HLS VOD completa
      description: "Sesión IPTV del relé VOD y del productor (docs/vod.md §9): la web recibe `hls` en `/api/v1/video/<sid>/index.m3u8` sin token y el iPhone `hls-fmp4` con `?t=`, los dos con `source: iptv`. No espera al primer segmento: la lista sale del índice. Tope de 40 s en el servidor (§9.12). Dos cosas por IPTV a la vez siguen la regla de la casa: la nueva corta la anterior."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{40}$
        - name: client
          in: query
          required: true
          schema:
            type: string
            enum:
              - web
              - ios
        - name: viewer
          in: query
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{4,64}$
        - name: device
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{4,64}$
        - name: start
          in: query
          required: false
          schema:
            type: number
            minimum: 0
            maximum: 86400
        - name: audio
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 15
        - name: hevc
          in: query
          required: false
          schema:
            default: "0"
            type: string
            enum:
              - "0"
              - "1"
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^s_[A-Za-z0-9_-]{8,64}$
                      heartbeatMs:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      expiresAfterMs:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                    required:
                      - id
                      - heartbeatMs
                      - expiresAfterMs
                    additionalProperties: false
                  url:
                    type: string
                    format: starts_with
                    pattern: ^\/.*
                  protocol:
                    type: string
                    enum:
                      - mpegts
                      - hls
                      - hls-fmp4
                  remux:
                    type: boolean
                  codec:
                    type: object
                    properties:
                      video:
                        type: string
                      audio:
                        type: string
                      source:
                        type: string
                        enum:
                          - scanner
                          - player
                          - ffprobe
                          - unknown
                    required:
                      - video
                      - audio
                      - source
                    additionalProperties: false
                  latency:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                          - stable
                          - balanced
                          - low
                      initialBufferS:
                        type: number
                        minimum: 0
                      rebuildS:
