# GENERADO por packages/shared/scripts/openapi.ts desde src/routes.ts. No editar a mano.
openapi: 3.1.0
info:
  title: Ace Player Neo · API v1
  version: 0.8.0
  description: "Generado desde packages/shared/src/routes.ts con scripts/openapi.ts: no editar a mano. Cada ruta existe también bajo /native (la entrada de la app iOS, D4), con origen native. Las rutas antiguas /api/* están en docs/openapi.yaml."
servers:
  - url: /
    description: Web (tras el login de Umbrel)
  - url: /native
    description: App iOS (sin login de Umbrel; credencial propia)
tags:
  - name: state
  - name: net
  - name: iptv
  - name: directories
  - name: engine
  - name: playback
  - name: remux
  - name: scanner
  - name: sources
  - name: football
  - name: teams
  - name: auth
  - name: events
  - name: diagnostics
  - name: health
  - name: search
paths:
  /api/v1/ping:
    get:
      operationId: ping
      tags:
        - health
      summary: Vivo y versión, sin datos
      description: "Sin token también desde /native: la app la usa para saber si la dirección es un Ace Player Neo antes de emparejar, y el vigilante del NAS puede usarla a través de la pasarela sin login."
      parameters: []
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    const: true
                  app:
                    type: string
                    const: ace-player-neo
                  version:
                    type: string
                  apiVersion:
                    type: number
                    const: 1
                  serverTime:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                required:
                  - ok
                  - app
                  - version
                  - apiVersion
                  - serverTime
                additionalProperties: false
        default:
          description: Error con el formato de /api/v1 (arquitectura §6.4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security: []
      x-access: any
      x-native-path: /native/api/v1/ping
      x-side-effects: false
      x-legacy-twin: null
      x-errors:
        - code: validation_error
          status: 400
          message: Falta algún dato o no tiene el formato esperado.
        - code: bad_json
          status: 400
          message: El cuerpo de la petición no es un JSON válido.
        - code: body_too_large
          status: 413
          message: La petición es demasiado grande (máximo 2 MiB).
        - code: cross_origin
          status: 403
          message: Se ha bloqueado una petición que venía de otra web.
        - code: origin_forbidden
          status: 403
          message: Esta función no está disponible desde aquí.
        - code: unauthorized
          status: 401
          message: Este dispositivo no está emparejado o su acceso ha caducado. Vuelve a emparejarlo.
        - code: device_revoked
          status: 401
          message: Se ha retirado el acceso de este dispositivo. Vuelve a emparejarlo desde la web.
        - code: not_found
          status: 404
          message: Esa dirección no existe.
        - code: not_implemented
          status: 501
          message: Esta función todavía no está disponible en esta versión.
        - code: internal_error
          status: 500
          message: Algo ha fallado en el servidor. Queda anotado en el registro.
