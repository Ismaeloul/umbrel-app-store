  /api/v1/iptv/channels:
    get:
      operationId: iptvChannels
      tags:
        - iptv
      summary: Buscar canales en tu IPTV (2 a 80 letras; hasta 50, España o sin país, sin adultos)
      description: "Buscador de la web (docs/iptv.md §14): una fila por canal (la mejor variante) con su nombre limpio, la calidad, el nombre del proveedor y los ids de tu biblioteca que son ese canal. Nunca lleva URL, grupo ni nada más del proveedor. Sin IPTV activa responde 200 con la lista vacía. Nada se lista sin escribir al menos 2 letras."
      parameters:
        - name: q
          in: query
          required: false
          schema:
            default: ""
            type: string
            maxLength: 500
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                    maxLength: 80
                  total:
                    type: integer
                    minimum: 0
                    maximum: 9007199254740991
                  capped:
                    type: boolean
                  channels:
                    maxItems: 50
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          pattern: ^[a-f0-9]{40}$
                        title:
                          type: string
                          minLength: 1
                          maxLength: 120
