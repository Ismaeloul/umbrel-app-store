  /api/v1/pairing:
    post:
      operationId: pairingCreate
      tags:
        - auth
      summary: Crear un código de 6 dígitos y su QR (5 min, un solo uso, anula el anterior)
      description: Desde la web (su dirección en baseUrl) o desde un iPhone emparejado (baseUrl = la dirección que usa ahora; alternateBaseUrls = la otra, casa o Tailscale). El QR lleva una u= por dirección, en ese orden. Si lo crea un iPhone y luego se revoca, su código muere.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl:
                  type: string
                  maxLength: 512
                  pattern: ^https?:\/\/(?:[A-Za-z0-9.-]{1,253}|\[[0-9A-Fa-f:.]{2,45}\])(?::\d{1,5})?$
                alternateBaseUrls:
                  maxItems: 2
                  type: array
                  items:
                    type: string
                    maxLength: 512
                    pattern: ^https?:\/\/(?:[A-Za-z0-9.-]{1,253}|\[[0-9A-Fa-f:.]{2,45}\])(?::\d{1,5})?$
              additionalProperties: false
      responses:
        "201":
          description: Correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    pattern: ^\d{6}$
                  expiresAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                  ttlMs:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  pairUri:
                    type: string
                    format: starts_with
                    pattern: ^aceneo:\/\/pair\?.*
                  qrSvg:
                    type: string
                    format: starts_with
                    pattern: ^<svg.*
                required:
                  - code
                  - expiresAt
                  - ttlMs
                  - pairUri
                  - qrSvg
                additionalProperties: false
        default:
          description: Error con el formato de /api/v1 (arquitectura §6.4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
        - umbrelGateway: []
        - deviceBearer: []
      x-access: any
      x-native-path: /native/api/v1/pairing
      x-side-effects: true
      x-legacy-twin: null
      x-errors:
        - code: bad_request
          status: 400
          message: La petición no es válida.
