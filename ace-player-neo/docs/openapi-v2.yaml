  /api/v1/channels/{id}/stream:
    get:
      operationId: channelStream
      tags:
        - playback
      summary: Abrir (o unirse a) la sesión del motor de un canal y recibir su URL
      description: "Espera a que la URL sea reproducible (la sesión abierta o, en iOS, el remux listo). Si el cliente cuelga, se cancela. Arquitectura §6.3. Con un id IPTV (docs/iptv.md §6.4) la sesión sale del relé y del remux: la web recibe `hls` en `/api/v1/video/<sid>/index.m3u8` sin token y el iPhone `hls-fmp4`, los dos con `source: iptv`."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-f0-9]{40}$
        - name: client
          in: query
          required: true
          schema:
            type: string
            enum:
              - web
              - ios
        - name: kind
          in: query
          required: false
          schema:
            default: auto
            type: string
            enum:
              - id
              - infohash
              - auto
        - name: mode
          in: query
          required: false
          schema:
            default: balanced
            type: string
            enum:
              - stable
              - balanced
              - low
        - name: viewer
          in: query
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{4,64}$
        - name: device
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{4,64}$
        - name: title
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                        pattern: ^s_[A-Za-z0-9_-]{8,64}$
                      heartbeatMs:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                      expiresAfterMs:
                        type: integer
                        exclusiveMinimum: 0
                        maximum: 9007199254740991
                    required:
                      - id
                      - heartbeatMs
                      - expiresAfterMs
                    additionalProperties: false
                  url:
                    type: string
                    format: starts_with
                    pattern: ^\/.*
                  protocol:
                    type: string
                    enum:
                      - mpegts
                      - hls
                      - hls-fmp4
                  remux:
                    type: boolean
                  codec:
                    type: object
                    properties:
                      video:
                        type: string
                      audio:
                        type: string
                      source:
                        type: string
                        enum:
                          - scanner
                          - player
                          - ffprobe
                          - unknown
                    required:
                      - video
                      - audio
                      - source
                    additionalProperties: false
                  latency:
                    type: object
                    properties:
                      mode:
                        type: string
                        enum:
                          - stable
                          - balanced
                          - low
                      initialBufferS:
                        type: number
                        minimum: 0
                      rebuildS:
                        type: number
                        minimum: 0
                      liveSync:
                        anyOf:
                          - type: object
                            properties:
                              targetS:
                                type: number
                                minimum: 0
                              maxS:
                                type: number
                                minimum: 0
                              rate:
                                type: number
                                exclusiveMinimum: 0
                            required:
                              - targetS
                              - maxS
                              - rate
                            additionalProperties: false
                          - type: "null"
                      ios:
                        type: object
                        properties:
                          preferredForwardBufferDuration:
                            type: number
                            minimum: 0
                          liveEdgeOffsetS:
                            type: number
                            minimum: 0
                        required:
                          - preferredForwardBufferDuration
                          - liveEdgeOffsetS
                        additionalProperties: false
                    required:
                      - mode
                      - initialBufferS
                      - rebuildS
                      - liveSync
                    additionalProperties: false
                  stats:
                    type: object
                    properties:
                      via:
                        type: string
                        const: sse
                    required:
                      - via
                    additionalProperties: false
                  handoff:
                    type: boolean
                  source:
                    type: string
                    enum:
                      - engine
                      - iptv
                required:
                  - session
                  - url
                  - protocol
                  - remux
                  - codec
                  - latency
                  - stats
                  - handoff
                additionalProperties: false
        default:
          description: Error con el formato de /api/v1 (arquitectura §6.4).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      security:
        - umbrelGateway: []
        - deviceBearer: []
      x-access: any
      x-native-path: /native/api/v1/channels/{id}/stream
      x-side-effects: true
      x-legacy-twin: GET /api/remux
      x-errors:
        - code: engine_unavailable
          status: 503
          message: El motor AceStream no responde. Si sigue así, reinícialo desde Ajustes.
        - code: engine_timeout
          status: 504
          message: El motor AceStream no ha respondido a tiempo.
        - code: source_no_peers
          status: 504
          message: Esta señal no tiene pares ahora mismo. Prueba otra fuente.
        - code: remux_busy
