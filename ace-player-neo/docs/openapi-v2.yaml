      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                baseUrl:
                  type: string
                  maxLength: 512
                  pattern: ^https?:\/\/(?:[A-Za-z0-9.-]{1,253}|\[[0-9A-Fa-f:.]{2,45}\])(?::\d{1,5})?$
                alternateBaseUrls:
                  maxItems: 2
                  type: array
                  items:
                    type: string
                    maxLength: 512
                    pattern: ^https?:\/\/(?:[A-Za-z0-9.-]{1,253}|\[[0-9A-Fa-f:.]{2,45}\])(?::\d{1,5})?$
              additionalProperties: false
