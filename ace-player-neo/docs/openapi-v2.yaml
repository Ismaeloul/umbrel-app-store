                - status
                - total
                - checked
                - playable
                - failed
                - waiting
                - retryAt
                - matchId
              additionalProperties: false
          required:
            - type
            - data
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: scan.verdict
            data:
              type: object
              properties:
                jobId:
                  anyOf:
                    - type: string
                      pattern: ^[a-f0-9]{24}$
                    - type: "null"
                hash:
                  type: string
                  pattern: ^[a-f0-9]{40}$
                state:
                  type: string
                  enum:
                    - working
                    - weak
                    - failed
                reason:
                  type: string
                by:
                  type: string
                  enum:
                    - scanner
                    - player
                checkedAt:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                playableOn:
                  type: object
                  properties:
                    web:
                      type: boolean
                    ios:
                      type: boolean
                  required:
                    - web
                    - ios
                  additionalProperties: false
              required:
                - jobId
                - hash
                - state
                - reason
                - by
                - checkedAt
              additionalProperties: false
          required:
            - type
            - data
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: state.changed
            data:
              type: object
              properties:
                scopes:
                  minItems: 1
                  type: array
                  items:
                    type: string
                    enum:
                      - library
                      - preferences
                      - directories
                      - bindings
                      - reports
                      - learning
                      - stats
                      - nowPlaying
                      - settings
                at:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
              required:
                - scopes
                - at
              additionalProperties: false
          required:
            - type
            - data
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: diagnostics.new
            data:
              type: object
              properties:
                id:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{6,40}$
                at:
                  type: string
                  format: date-time
                  pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                cause:
                  type: string
                  enum:
                    - engine
                    - source
                    - network
                    - codec
                    - client
                    - state
                code:
                  type: string
                  pattern: ^[a-z0-9_]{1,40}$
                message:
                  type: string
                  maxLength: 500
                hash:
                  type: string
                  pattern: ^[a-f0-9]{40}$
                channel:
                  type: string
                  maxLength: 120
                deviceId:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{4,64}$
                sessionId:
                  type: string
                  pattern: ^s_[A-Za-z0-9_-]{8,64}$
                requestId:
                  type: string
                  maxLength: 128
                metrics:
                  type: object
                  properties:
                    timeToFirstFrameMs:
                      type: number
                      minimum: 0
                    remuxStartMs:
                      type: number
                      minimum: 0
                    rebuffers:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    rebufferMs:
                      type: number
                      minimum: 0
                    reconnects:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    liveLatencyS:
                      type: number
                      minimum: 0
                  additionalProperties: false
              required:
                - id
                - at
                - cause
                - code
                - message
              additionalProperties: false
          required:
            - type
            - data
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: devices.changed
            data:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                    - paired
                    - revoked
                    - renamed
                deviceId:
                  type: string
              required:
                - reason
                - deviceId
              additionalProperties: false
          required:
            - type
            - data
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: iptv.status
            data:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - syncing
                    - ok
                    - error
                    - disabled
                channels:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
                updatedAt:
                  anyOf:
                    - type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    - type: "null"
                error:
                  anyOf:
                    - type: object
                      properties:
                        code:
                          type: string
                          pattern: ^[a-z0-9_]{1,40}$
                        message:
                          type: string
                      required:
                        - code
                        - message
                      additionalProperties: false
                    - type: "null"
                staleSince:
                  anyOf:
                    - type: string
                      format: date-time
                      pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                    - type: "null"
                account:
                  anyOf:
                    - type: object
                      properties:
                        status:
                          type: string
                          enum:
                            - active
                            - expired
                            - banned
                            - disabled
                            - unknown
                        expiresAt:
                          anyOf:
                            - type: string
                              format: date-time
                              pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                            - type: "null"
                        maxConnections:
                          anyOf:
                            - type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            - type: "null"
                        activeConnections:
                          anyOf:
                            - type: integer
                              minimum: 0
                              maximum: 9007199254740991
                            - type: "null"
                        ours:
                          type: integer
                          minimum: 0
                          maximum: 9007199254740991
                      required:
                        - status
                        - expiresAt
                        - maxConnections
                        - activeConnections
                        - ours
                      additionalProperties: false
                    - type: "null"
                guide:
                  type: object
                  properties:
                    available:
                      type: boolean
                    channelsWithGuide:
                      type: integer
                      minimum: 0
                      maximum: 9007199254740991
                    updatedAt:
                      anyOf:
                        - type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        - type: "null"
                    failedAt:
                      anyOf:
                        - type: string
                          format: date-time
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z))$
                        - type: "null"
                  required:
                    - available
                    - channelsWithGuide
                    - updatedAt
                    - failedAt
                  additionalProperties: false
              required:
                - status
                - channels
                - updatedAt
                - error
                - staleSince
                - account
                - guide
              additionalProperties: false
          required:
            - type
            - data
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              const: resync
            data:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                    - buffer_miss
                    - unknown_event_id
                    - server_restart
              required:
                - reason
              additionalProperties: false
          required:
            - type
            - data
          additionalProperties: false
  securitySchemes:
    umbrelGateway:
      type: apiKey
      in: cookie
      name: umbrel
      description: "Origen web: la sesión la comprueba la pasarela de Umbrel antes de llegar al backend; el backend no ve ninguna credencial."
    deviceBearer:
      type: http
      scheme: bearer
      description: Token `<deviceId>.<secreto>` que da POST /api/v1/pairing/claim (solo origen native).
    videoToken:
      type: apiKey
      in: query
      name: t
      description: "URL de vídeo firmada: HMAC de { sid, dev, exp } (arquitectura §5.12)."
