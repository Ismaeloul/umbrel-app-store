  /api/v1/iptv/browse:
    get:
      operationId: iptvBrowse
      tags:
        - iptv
      summary: "Recorrer tu IPTV como la ordena el proveedor: categorías, canales por páginas, texto y filtros con facetas"
      description: "La pestaña IPTV de Canales (docs/iptv.md §16): categorías del proveedor en su orden y con su número de canales, una fila por canal (nombre limpio y país) con sus calidades, filtros de país, idioma, tipo, deporte y calidad (O dentro de un filtro, Y entre filtros) con sus recuentos, y páginas de 60 con `nextCursor`. El servidor filtra, pagina y cuenta sobre un índice en memoria. Sin IPTV activa responde 200 con `active: false`; una categoría que ya no existe, `category: null`; un cursor de otro catálogo, la primera página con `stale: true`. Nunca lleva URL, `stream_id`, `tvg-id` ni credenciales."
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?:[a-f0-9]{12}|none)$
        - name: q
          in: query
          required: false
          schema:
            default: ""
            type: string
            maxLength: 500
        - name: country
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?:[A-Z]{2,4}|none)(?:,(?:[A-Z]{2,4}|none)){0,15}$
        - name: language
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?:[a-z]{2}|none)(?:,(?:[a-z]{2}|none)){0,15}$
        - name: type
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?:generalistas|deportes|cine|series|noticias|infantil|documentales|musica|entretenimiento|religion|adultos|none)(?:,(?:generalistas|deportes|cine|series|noticias|infantil|documentales|musica|entretenimiento|religion|adultos|none)){0,15}$
        - name: sport
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?:futbol|baloncesto|f1|motos|motor|tenis|padel|golf|ciclismo|balonmano|rugby|lucha|futbol-americano|hockey|beisbol|toros)(?:,(?:futbol|baloncesto|f1|motos|motor|tenis|padel|golf|ciclismo|balonmano|rugby|lucha|futbol-americano|hockey|beisbol|toros)){0,15}$
        - name: quality
          in: query
          required: false
          schema:
            type: string
            pattern: ^(?:uhd|fhd|hd|sd|none)(?:,(?:uhd|fhd|hd|sd|none)){0,15}$
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,64}$
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: Correcto
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: boolean
                  provider:
                    type: string
                    maxLength: 40
                  catalog:
                    type: string
                    pattern: ^[a-z0-9]{1,16}$
                  query:
                    type: string
                    maxLength: 80
                  category:
                    anyOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            pattern: ^(?:[a-f0-9]{12}|none)$
                          name:
                            type: string
                            maxLength: 120
                          count:
                            type: integer
                            minimum: 0
                            maximum: 9007199254740991
                        required:
                          - id
                          - name
                          - count
                        additionalProperties: false
                      - type: "null"
                  total:
