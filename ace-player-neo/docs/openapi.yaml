      properties:
        restarted:
          type: boolean
          const: true

    SearchResult:
      type: object
      description: parseAceSearchResults (server.js:3599-3632).
      required: [id, title, category, availability, bitrate, ih]
      properties:
        id:
          $ref: "#/components/schemas/Hash"
        title:
          type: string
        category:
          type: string
        availability:
          type: ["number", "null"]
        bitrate:
          type: ["number", "null"]
        ih:
          type: boolean
          const: true

    SearchResponse:
      type: object
      required: [query, results]
      additionalProperties: false
      properties:
        query:
          type: string
        results:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/SearchResult"

    RemuxResponse:
      type: object
      required: [url, token]
      additionalProperties: false
      properties:
        url:
          type: string
          pattern: "^/remux/[a-f0-9]{40}/index\\.m3u8$"
        token:
          type: string
          pattern: "^[a-f0-9]{16}$"
          description: Nuevo en cada petición; se usa en /api/remux/stop.

    RemuxStopInput:
      type: object
      required: [id]
      properties:
        id:
          $ref: "#/components/schemas/HashInput"
        dev:
          type: string
          description: "Se filtra a [a-zA-Z0-9_-] y se corta a 40."
        token:
          type: string
          description: "Se filtra a [a-f0-9] y se corta a 32."
        keepAlive:
          type: boolean
          description: true = solo desengancharse, nunca parar ffmpeg.

    RemuxStopResponse:
      type: object
      required: [success, stopped, detached]
      properties:
        success:
          type: boolean
          const: true
        stopped:
          type: boolean
        detached:
          type: boolean
        stale:
          type: boolean
          const: true
          description: Stop atrasado de un enganche anterior; no se ha tocado nada.

    StreamsSyncInput:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Solo http o https; se quitan usuario y contraseña.
        type:
          type: string
          enum: [m3u, html]
          description: Cualquier valor distinto de html cuenta como m3u.
        sourceId:
          type: string
          description: Refrescar ese directorio (puede cambiarle la url y el tipo).
        name:
          type: string
          description: >-
            No se rechaza: se colapsan espacios y se corta a 60 (sin quitar HTML). Si falta, se
            conserva el nombre o se usa el hostname.

    SourceIdInput:
      type: object
      required: [sourceId]
      properties:
        sourceId:
          type: string
          description: Tiene que ser idéntico al id de un directorio existente.
