<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Iconos</title><style>
body{margin:0;padding:40px;background:#8a8f94;font-family:system-ui;display:flex;gap:40px;align-items:flex-end;flex-wrap:wrap}
figure{margin:0;display:grid;gap:10px;justify-items:center;color:#fff;font-size:14px}
img{display:block;border-radius:22.5%}
.g img{width:240px;height:240px}.p img{width:60px;height:60px}.f img{width:32px;height:32px;border-radius:6px}
</style></head><body>
<figure class="g"><img src="icono.svg" alt=""><figcaption>Claro (por defecto)</figcaption></figure>
<figure class="g"><img src="icono-oscuro.svg" alt=""><figcaption>Oscuro</figcaption></figure>
<figure class="g"><img src="icono-tintado.svg" alt=""><figcaption>Tintado (fuente)</figcaption></figure>
<figure class="p"><img src="icono.svg" alt=""><figcaption>60 pt</figcaption></figure>
<figure class="p"><img src="icono-oscuro.svg" alt=""><figcaption>60 pt</figcaption></figure>
<figure class="f"><img src="icono.svg" alt=""><figcaption>32 px</figcaption></figure>
</body></html>
