# Proyecto de Xcode de Ace Neo, generado con XcodeGen:
#   brew install xcodegen && xcodegen generate
# El .xcodeproj NO se sube a git: se genera desde aquí (también en la CI).

name: AceNeo

options:
  bundleIdPrefix: es.ismaeloul
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

configFiles:
  Debug: Config/AceNeo.xcconfig
  Release: Config/AceNeo.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

targets:
  AceNeo:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_NAME: AceNeo
        PRODUCT_BUNDLE_IDENTIFIER: $(ACE_BUNDLE_ID)
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  AceNeoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AceNeoTests
      # Los ejemplos de @ace/shared van tal cual al bundle de los tests
      # (carpeta «fixtures» con v1/, events/ y errors/): si un contrato cambia
      # sin tocar Swift, los tests de decodificación fallan.
      - path: ../../packages/shared/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: AceNeo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ACE_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AceNeo.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/AceNeo
        BUNDLE_LOADER: $(TEST_HOST)

  AceNeoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/AceNeoUITests
    dependencies:
      - target: AceNeo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ACE_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AceNeo

schemes:
  AceNeo:
    build:
      targets:
        AceNeo: all
        AceNeoTests: [test]
        AceNeoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - AceNeo
      targets:
        - name: AceNeoTests
          parallelizable: false
        - name: AceNeoUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
