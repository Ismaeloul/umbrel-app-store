<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <!-- La página de invitado de «Ver juntos» (docs/ver-juntos.md §9): la sirve
         el proxy de la sala en https://<dominio>/s/<código>. Solo la sala: sin
         armazón, sin bootstrap y sin service worker. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Ver juntos</title>
    <meta name="description" content="Ver una película o una serie a la vez, con chat." />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#05070a" />
    <link rel="manifest" href="/invitado.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ver juntos" />
    <meta name="format-detection" content="telephone=no" />
    <style>
      html {
        background: #05070a;
      }
    </style>
    <script>
      (function () {
        var d = document.documentElement;
        d.setAttribute('data-theme', 'dark');
        d.setAttribute('data-scheme', 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/guest/main.tsx"></script>
  </body>
</html>
