<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: la app pinta bajo la isla y la barra de gestos y
         se aparta con env(safe-area-inset-*). resizes-content: en Android el
         teclado encoge la página en vez de tapar los campos. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Ace Player Neo</title>
    <meta
      name="description"
      content="Agenda de fútbol con el canal de cada partido y reproducción AceStream desde el navegador."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e5eef4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#081829" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ace Player" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Fondo del tema ANTES de que llegue el CSS: sin fogonazo blanco en oscuro. -->
    <style>
      html {
        background: #e5eef4;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #081829;
        }
      }
      html[data-theme='dark'] {
        background: #081829;
      }
    </style>
    <!-- Tema y transparencia guardados en Ajustes, aplicados antes de pintar
         (lo mismo que hace src/app/theme.ts después). Con try/catch: en una
         ventana privada localStorage puede lanzar. La CSP de nginx permite
         scripts en línea ('unsafe-inline'). -->
    <script>
      (function () {
        var d = document.documentElement;
        var t = null;
        var r = null;
        try {
          t = localStorage.getItem('aceneo-tema');
          r = localStorage.getItem('aceneo-transparencia');
        } catch (e) {}
        var dark = false;
        try {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var s = t === 'claro' ? 'light' : t === 'oscuro' ? 'dark' : dark ? 'dark' : 'light';
        if (t === 'claro' || t === 'oscuro') d.setAttribute('data-theme', s);
        d.setAttribute('data-scheme', s);
        if (r === 'reducida') d.setAttribute('data-transparency', 'reduced');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Ace Player Neo necesita JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
